<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

.pmfi-docs{
  --bg:#060A14; --bg-raise:#0A1020; --panel:rgba(12,18,34,0.66);
  --ink:#EAEFFA; --ink-2:#AEBBD4; --pm-muted:#5E6E8C; --muted-2:#43506B;
  --line:rgba(120,142,184,0.16); --line-2:rgba(120,142,184,0.30);
  --edge:#54E6AE; --edge-dim:rgba(84,230,174,0.14); --amber:#E8B25A; --ice:#7FB4FF; --danger:#E06A6A;
  --violet:#9B8CFF; --violet-dim:rgba(155,140,255,0.14);
  --primary:210 40% 98%;
  --font-display:'Archivo',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --hdr:62px;
  position:relative; min-height:100vh; width:100%; overflow-x:hidden;
  background:var(--bg); color:var(--ink);
  font-family:var(--font-display); line-height:1.5;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
.pmfi-docs::selection{background:rgba(84,230,174,0.22)}

/* ambient background */
.pmfi-grid-bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:0.5}
.pmfi-glow{position:fixed;z-index:0;pointer-events:none;width:60vw;height:60vw;max-width:760px;max-height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(84,230,174,0.10),transparent 62%);top:-16vw;left:50%;transform:translateX(-50%);filter:blur(8px)}

/* header */
.pm-header{position:sticky;top:0;z-index:50;height:var(--hdr);backdrop-filter:blur(10px);
  background:linear-gradient(to bottom,rgba(6,10,20,0.92),rgba(6,10,20,0.6));border-bottom:1px solid var(--line)}
.pm-header .bar{display:flex;align-items:center;justify-content:space-between;height:var(--hdr);max-width:1440px;margin:0 auto;padding:0 24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand-mark{width:30px;height:30px;border:1px solid var(--line-2);border-radius:50%;object-fit:cover;flex:none;display:block;background:var(--bg-raise)}
.brand-name{font-weight:900;letter-spacing:0.04em;font-size:18px;color:var(--ink)}
.brand .tag{display:none}
@media(min-width:760px){.brand .tag{display:inline;color:var(--pm-muted);font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;border-left:1px solid var(--line);padding-left:12px;margin-left:2px}}
nav.top{display:flex;align-items:center;gap:8px}
nav.top a.txt{display:none}
@media(min-width:900px){nav.top a.txt{display:inline;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--ink-2);padding:8px 12px;text-decoration:none;transition:color .2s}nav.top a.txt:hover{color:var(--ink)}}
.btn{font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.18em;padding:9px 16px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink);background:transparent;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all .22s ease;white-space:nowrap}
.btn:hover{border-color:var(--edge);color:var(--edge);box-shadow:0 0 0 1px rgba(84,230,174,0.25)}
.btn.solid{background:var(--edge);color:#04130D;border-color:var(--edge)}
.btn.solid:hover{background:#6cf0bd;box-shadow:0 8px 30px rgba(84,230,174,0.28)}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--line-2);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
@media(min-width:900px){.menu-btn{display:none}}

/* layout */
.docs-layout{position:relative;z-index:2;max-width:1440px;margin:0 auto;display:grid;grid-template-columns:288px minmax(0,1fr) 232px;align-items:start}
@media(max-width:1180px){.docs-layout{grid-template-columns:288px minmax(0,1fr)}}
@media(max-width:900px){.docs-layout{grid-template-columns:minmax(0,1fr)}}

/* sidebar */
.sidebar{position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow-y:auto;border-right:1px solid var(--line);padding:22px 16px 60px}
.sidebar::-webkit-scrollbar{width:8px}.sidebar::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
.search-wrap{position:relative;margin-bottom:22px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--pm-muted);fill:none;stroke-width:2}
.search{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:8px;background:rgba(6,10,20,0.6);color:var(--ink);font-family:var(--font-mono);font-size:12px;letter-spacing:0.02em;outline:none;transition:border-color .18s}
.search::placeholder{color:var(--pm-muted);text-transform:uppercase;letter-spacing:0.12em;font-size:10.5px}
.search:focus{border-color:var(--edge);box-shadow:0 0 0 1px rgba(84,230,174,0.2)}
.nav-group{margin-bottom:20px}
.nav-group-title{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--pm-muted);padding:0 10px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;border:0;background:transparent;color:var(--ink-2);font-family:var(--font-display);font-size:13.5px;font-weight:500;letter-spacing:0.005em;cursor:pointer;text-decoration:none;border-left:1px solid transparent;transition:color .16s,background .16s,border-color .16s}
.nav-item .idx{font-family:var(--font-mono);font-size:10px;color:var(--muted-2);letter-spacing:0.06em;min-width:20px}
.nav-item:hover{color:var(--ink);background:rgba(120,142,184,0.06)}
.nav-item.active{color:var(--edge);border-left:1px solid var(--edge);border-radius:0 7px 7px 0;background:rgba(84,230,174,0.06)}
.nav-item.active .idx{color:var(--edge)}
.nav-empty{display:none}

/* main / article */
.main{min-width:0;padding:46px 56px 100px}
@media(max-width:1180px){.main{padding:42px 44px 90px}}
@media(max-width:640px){.main{padding:30px 20px 80px}}
.docs-breadcrumb{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--pm-muted);margin-bottom:26px}
.docs-breadcrumb .sep{color:var(--muted-2);margin:0 8px}
.docs-breadcrumb .cur{color:var(--ink-2)}

.docs-article{max-width:820px}
.docs-eyebrow{display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.26em;color:var(--edge);margin-bottom:16px}
.docs-article h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.02;letter-spacing:-0.03em;color:var(--ink);margin-bottom:1.35rem}
.docs-article h2{font-family:var(--font-display);font-size:clamp(1.2rem,2vw,1.5rem);font-weight:700;line-height:1.24;letter-spacing:-0.018em;color:hsl(var(--primary)/0.9);margin-top:2.4rem;margin-bottom:0.7rem;scroll-margin-top:calc(var(--hdr) + 20px);padding-top:1.4rem;border-top:1px solid var(--line)}
.docs-article h2:first-of-type{border-top:0;padding-top:0}
.docs-article h3{font-family:var(--font-display);font-size:1.02rem;font-weight:700;line-height:1.35;color:hsl(var(--primary)/0.82);margin-top:1.5rem;margin-bottom:0.45rem;scroll-margin-top:calc(var(--hdr) + 20px)}
.docs-article p{font-family:var(--font-display);color:hsl(var(--primary)/0.6);font-size:0.98rem;line-height:1.82;letter-spacing:0.004em;margin:0.82rem 0}
.docs-article ul,.docs-article ol{font-family:var(--font-display);margin:0.85rem 0 1.35rem 1.3rem;color:hsl(var(--primary)/0.6)}
.docs-article ul{list-style:disc}.docs-article ol{list-style:decimal}
.docs-article li{padding-left:0.25rem;margin:0.4rem 0;line-height:1.7}
.docs-article a{color:var(--edge);text-decoration:none;border-bottom:1px solid var(--edge-dim);transition:border-color .16s}
.docs-article a:hover{border-bottom-color:var(--edge)}
.docs-article code{font-family:var(--font-mono);border:1px solid hsl(var(--primary)/0.12);background:hsl(var(--primary)/0.035);color:hsl(var(--primary)/0.84);border-radius:5px;padding:0.08rem 0.34rem;font-size:0.85em}
.docs-article a code{color:var(--edge)}

.docs-article table{width:100%;border-collapse:collapse;margin:1.1rem 0 1.6rem;color:hsl(var(--primary)/0.64);font-size:0.9rem;font-family:var(--font-display)}
.docs-article th,.docs-article td{border:1px solid hsl(var(--primary)/0.1);padding:0.72rem 0.8rem;text-align:left;vertical-align:top}
.docs-article th{color:hsl(var(--primary)/0.8);background:hsl(var(--primary)/0.03);font-weight:700;font-family:var(--font-mono);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em}
.docs-article td code{font-size:0.8em}

.inline-flex{display:inline-flex}.items-center{align-items:center}.gap-2{gap:0.5rem}

.docs-callout{border:1px solid hsl(var(--primary)/0.12);background:hsl(var(--primary)/0.035);color:hsl(var(--primary)/0.7);border-radius:10px;padding:1rem 1.1rem;font-size:0.93rem;line-height:1.66;margin:1.4rem 0;font-family:var(--font-display);border-left:2px solid var(--line-2)}
.docs-callout strong{color:hsl(var(--primary)/0.92);font-weight:700}
.docs-callout a{color:var(--edge)}
.docs-callout.audit{border-color:hsl(42 90% 55%/0.24);border-left-color:var(--amber);background:hsl(42 90% 55%/0.05)}
.docs-callout.verify{border-color:hsl(84 70% 60%/0.2);border-left-color:var(--edge);background:rgba(84,230,174,0.045)}

.docs-code-block{border:1px solid hsl(var(--primary)/0.12);background:rgba(0,0,0,0.28);color:hsl(var(--primary)/0.76);border-radius:10px;padding:0.95rem 1.05rem;overflow-x:auto;font-size:0.85rem;line-height:1.66;margin:1rem 0 1.35rem;font-family:var(--font-mono)}
.docs-code-block code{border:0!important;background:transparent!important;padding:0!important;color:inherit!important;font-family:var(--font-mono)}

.docs-copy-btn{font-family:var(--font-mono);border:1px solid hsl(var(--primary)/0.14);border-radius:5px;padding:0.18rem 0.5rem;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:hsl(var(--primary)/0.55);background:hsl(var(--primary)/0.03);cursor:pointer;transition:all .16s}
.docs-copy-btn:hover{color:var(--edge);border-color:var(--edge)}
.docs-copy-btn.done{color:var(--edge);border-color:var(--edge)}

/* OpLend "How it works" explainer (borrower / lender) */
.docs-article .ol-hiw{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:18px;margin:1.2rem 0 1.7rem}
.ol-tabs{display:flex;gap:6px;margin-bottom:18px}
.ol-tab{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;padding:8px 14px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--pm-muted);cursor:pointer;transition:all .16s}
.ol-tab:hover{color:var(--ink-2);border-color:var(--line-2)}
.ol-tab.active{color:var(--edge);border-color:var(--edge);background:rgba(84,230,174,0.06)}
.ol-view[hidden]{display:none}
.ol-split{border:1px solid var(--line);border-radius:10px;padding:22px 18px 20px;margin-bottom:20px;background:rgba(6,10,20,0.4)}
.ol-collateral{width:max-content;max-width:100%;margin:0 auto;border:1px solid var(--line-2);border-radius:8px;padding:11px 22px;font-weight:700;color:var(--ink);text-align:center;font-size:15px}
.ol-branch{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px;position:relative}
.ol-branch::before{content:"";position:absolute;top:-24px;left:50%;width:1px;height:24px;background:var(--line-2)}
.ol-leg{border:1px solid var(--line);border-top-width:2px;border-radius:10px;padding:22px 14px;text-align:center;background:rgba(0,0,0,0.25)}
.ol-leg.p{border-top-color:var(--edge)}
.ol-leg.n{border-top-color:var(--violet)}
.ol-leg-k{font-family:var(--font-mono);font-size:30px;font-weight:600;line-height:1}
.ol-leg.p .ol-leg-k{color:var(--edge)}
.ol-leg.n .ol-leg-k{color:var(--violet)}
.ol-leg-t{font-weight:700;color:var(--ink);margin-top:12px;font-size:15px}
.ol-leg-s{color:var(--pm-muted);font-size:12.5px;margin-top:4px}
.ol-steps{display:flex;flex-direction:column;gap:0;margin:0 0 6px}
.ol-step{display:flex;gap:14px;padding:12px 4px;align-items:flex-start}
.ol-step .ol-n{font-family:var(--font-mono);font-size:12px;color:var(--pm-muted);min-width:20px;padding-top:2px}
.ol-step b{display:block;color:var(--ink);font-size:15px;font-weight:700}
.ol-step p{margin:3px 0 0;color:var(--pm-muted);font-size:13.5px;line-height:1.5}
.ol-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.ol-card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:rgba(6,10,20,0.4)}
.ol-card .ol-sq{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:rgba(84,230,174,0.1);color:var(--edge);font-family:var(--font-mono);font-weight:600;font-size:15px;margin-bottom:12px}
.ol-card b{display:block;color:var(--ink);font-size:17px;font-weight:700}
.ol-card p{margin:6px 0 0;color:var(--pm-muted);font-size:13.5px;line-height:1.5}
.ol-out{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:10px}
.ol-out b{display:block;font-size:14.5px;font-weight:700;margin-bottom:3px}
.ol-out p{margin:0;color:var(--pm-muted);font-size:13.5px;line-height:1.5}
.ol-out.good{border-left:2px solid var(--edge)}
.ol-out.good b{color:var(--edge)}
.ol-out.bad{border-left:2px solid var(--violet)}
.ol-out.bad b{color:var(--violet)}
@media(max-width:520px){.ol-branch{grid-template-columns:1fr}.ol-branch::before{display:none}}

/* toc */
.toc{position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow-y:auto;padding:48px 22px 60px 4px}
@media(max-width:1180px){.toc{display:none}}
.toc-inner{border-left:1px solid var(--line);padding-left:16px}
.toc-title{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:0.24em;color:var(--pm-muted);margin-bottom:12px}
.toc a{display:block;padding:5px 0;font-family:var(--font-display);font-size:12.5px;line-height:1.35;color:hsl(var(--primary)/0.42);text-decoration:none;border-left:1px solid transparent;margin-left:-16px;padding-left:16px;transition:color .16s,border-color .16s}
.toc a.sub{padding-left:28px;font-size:12px;color:hsl(var(--primary)/0.34)}
.toc a:hover{color:hsl(var(--primary)/0.75)}
.toc a.active{color:var(--edge);border-left-color:var(--edge)}

/* footer */
.pm-footer{position:relative;z-index:2;border-top:1px solid var(--line);margin-top:0;padding:30px 24px 46px}
.foot{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:18px;justify-content:space-between;align-items:flex-start}
@media(min-width:760px){.foot{flex-direction:row;align-items:center}}
.foot .links{display:flex;flex-wrap:wrap;gap:8px 22px}
.foot a{font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--pm-muted);text-decoration:none;transition:color .2s}
.foot a:hover{color:var(--ink)}
.foot .copy{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;color:var(--muted-2)}

/* mobile sidebar drawer */
.scrim{display:none;position:fixed;inset:0;z-index:40;background:rgba(3,6,14,0.6);backdrop-filter:blur(2px)}
@media(max-width:900px){
  .sidebar{position:fixed;top:var(--hdr);left:0;width:300px;max-width:86vw;z-index:45;background:var(--bg-raise);transform:translateX(-102%);transition:transform .26s cubic-bezier(.22,1,.36,1);height:calc(100vh - var(--hdr))}
  .pmfi-docs.nav-open .sidebar{transform:translateX(0)}
  .pmfi-docs.nav-open .scrim{display:block}
}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--edge);box-shadow:0 0 10px var(--edge);animation:pmfi-pulse 2.2s infinite;flex:none}
@keyframes pmfi-pulse{0%,100%{opacity:1}50%{opacity:0.25}}

@media(prefers-reduced-motion:reduce){*,.pmfi-grid-bg{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--edge);outline-offset:2px}
</style>
</head>

const DATA = {"pages": {"what-is-pmfi": "<article class=\"docs-article max-w-[820px]\"><h1>What is PMFI?</h1><p>PMFI is a protocol for automated prediction market vaults.</p><p>The first PMFI product is the pArbitrage Vault, a USDC-denominated vault designed to execute prediction market arbitrage when predefined pricing and execution conditions are met.</p><p>PMFI does not require users to manually monitor markets, place individual trades, or manage each position directly.</p><h2 id=\"current-status\">Current status</h2><table><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Network</td><td>Base</td></tr><tr><td>Vault</td><td>pArbitrage Vault</td></tr><tr><td>Vault token</td><td>pARB</td></tr><tr><td>Deposit asset</td><td>USDC</td></tr><tr><td>Audit status</td><td>Pending</td></tr></tbody></table><div class=\"docs-callout\">PMFI is currently in beta. Vault performance is not guaranteed. Audit is pending.</div></article>", "parbitrage-vault": "<article class=\"docs-article max-w-[820px]\"><h1>pArbitrage Vault</h1><p>The pArbitrage Vault is an automated USDC vault for prediction market arbitrage.</p><p>Users deposit USDC and receive pARB vault shares after their deposit request is processed by a vault report.</p><p>The vault strategy searches for paired YES and NO exposure across supported prediction market venues. If pricing conditions are met, the strategy may open a paired position.</p><h2 id=\"core-mechanism\">Core mechanism</h2><p>In binary prediction markets, YES + NO settle to $1 together.</p><p>When the combined cost of YES + NO falls below $1 after fees and execution buffers, the vault can capture the spread.</p><h2 id=\"what-users-hold\">What users hold</h2><p>Users hold pARB shares.</p><p>Users do not directly hold or manage individual prediction market positions. The vault and offchain execution system manage strategy execution, accounting, and reporting.</p><h2 id=\"contract-address\">Contract address</h2><table><thead><tr><th>Contract</th><th>Address</th></tr></thead><tbody><tr><td>pArbitrage Vault V2</td><td><span class=\"inline-flex items-center gap-2\"><code>0xd1ccBc2Aa6e2f41817b62448089d4125E62df4fb</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td></tr></tbody></table><h2 id=\"important-note\">Important note</h2><p>The vault does not guarantee profit, APR, APY.</p><h2 id=\"faq-strategy\">FAQ</h2>\n<h3>What is the pArbitrage Vault?</h3>\n<p>The pArbitrage Vault is a USDC-denominated vault that provides automated exposure to prediction-market arbitrage. Users deposit USDC and receive pARB shares representing their proportional position in the vault. PMFI monitors supported venues, identifies equivalent markets, and executes trades when the expected spread remains positive after applicable fees and execution costs. See <a href=\"#strategy-logic\">Strategy logic</a>.</p>\n<h3>Where does the vault's return come from?</h3>\n<p>The core return comes from price differences between equivalent prediction markets. For example, the vault may buy YES on one venue and NO on another when the combined all-in cost is below $1.00. If both positions are fully executed and the markets resolve consistently, one side pays $1.00 at settlement. The difference between the payout and the combined acquisition cost represents the gross arbitrage spread.</p>\n<p>Net vault performance is affected by trading fees, execution costs, slippage, settlement time, capital utilization, venue incentives, and the performance fee.</p>\n<h3>Does the vault take directional bets?</h3>\n<p>The strategy is designed to become market-neutral once both complementary positions have been fully executed. It is not designed to predict whether an event will happen. Instead, it seeks to own positions covering both possible outcomes for a combined cost below their expected settlement value.</p>\n<p>Market-neutral does not mean risk-free. Partial fills, mismatched market rules, settlement differences, venue failures, or operational issues can prevent the positions from producing the expected payoff.</p>\n<h3>Does the vault execute every price difference it detects?</h3>\n<p>No. A visible price difference is not necessarily an executable arbitrage opportunity. Before execution, the strategy evaluates factors including:</p>\n<ul><li>whether the markets represent the same outcome;</li><li>available order-book liquidity;</li><li>expected fill prices;</li><li>venue and trading fees;</li><li>slippage;</li><li>position size;</li><li>settlement timing;</li><li>expected net return.</li></ul>\n<p>The vault may leave capital undeployed when available opportunities do not meet its execution requirements.</p>\n<h3>What happens if only one side of an arbitrage trade fills?</h3>\n<p>Prediction-market orders can be rejected, delayed, or partially filled. If one side fills without the matching position being completed, the vault may temporarily have unhedged market exposure. This can reduce or eliminate the expected arbitrage profit and may result in a loss. This is one of the strategy's principal execution risks. See <a href=\"#risk-disclosure\">Risk disclosure</a>.</p>\n<h3>How does PMFI determine whether two markets are equivalent?</h3>\n<p>Equivalent markets must refer to the same underlying event and produce complementary economic outcomes. Market comparison includes factors such as:</p>\n<ul><li>event wording;</li><li>outcome definitions;</li><li>relevant dates and deadlines;</li><li>geographic or jurisdictional scope;</li><li>official resolution sources;</li><li>cancellation and invalidation rules;</li><li>determination and payout conditions.</li></ul>\n<p>Markets with similar titles are not necessarily equivalent.</p>\n<h3>What happens if paired markets resolve differently?</h3>\n<p>The expected arbitrage payoff depends on both venues resolving according to economically equivalent criteria. Differences in wording, deadlines, official sources, cancellation rules, or venue interpretation may cause paired markets to resolve differently. In that case, the combined positions may pay less than expected and the vault may incur a loss. This is referred to as resolution or basis risk.</p>\n<h3>Why can positions remain open after the event has occurred?</h3>\n<p>A real-world event occurring does not always mean that a prediction market can settle immediately. Each venue must determine the outcome according to its own market rules and official resolution source. Confirmation, disputes, delayed source data, or venue procedures may extend the time between the apparent event outcome and final settlement. Until settlement is completed and the payout is received, the related capital may remain unavailable for new trades or redemptions.</p>\n<h3>What happens when there are no qualifying arbitrage opportunities?</h3>\n<p>The vault does not force capital into trades solely to maintain a target APR. USDC may remain idle when available spreads do not satisfy the strategy's requirements. This protects the vault from knowingly entering unattractive trades, but lower capital utilization can reduce realized returns. Opportunity frequency, market liquidity, available spreads, and settlement duration can all affect vault performance.</p>\n<h3>Which venues does the strategy use?</h3>\n<p>PMFI supports integrations with Polymarket, Kalshi, and Opinion. Individual venues may be active, paused, or unavailable depending on liquidity, operational status, market coverage, and strategy requirements. The vault only executes when an eligible market pair and acceptable execution conditions are available. The app and <a href=\"#strategy-logic\">strategy documentation</a> should be treated as the source for currently active venues.</p>\n<h2 id=\"faq-parb\">FAQ: pARB &amp; accounting</h2>\n<h3>What is pARB?</h3>\n<p>pARB is the ERC-20 share token of the pArbitrage Vault. It represents a proportional claim on the vault's reported backing. The estimated USDC value of a user's position is based on the number of pARB shares held and the vault's official price per share. pARB is not a stablecoin and does not represent a fixed promise to return one USDC per token.</p>\n<h3>Is one pARB always worth one USDC?</h3>\n<p>No. pARB begins from an initial price of $1.00, but its official price per share can change as the vault generates profits, incurs fees, or experiences losses. The $1.00 floor used when pricing new deposits protects existing holders from below-$1 dilution. It does not guarantee that redemptions will always be paid at or above $1.00 per pARB.</p>\n<h3>When does the pARB price update?</h3>\n<p>The official pARB price updates through vault reports rather than continuously after every trade or market-price movement. A report updates the vault's reported backing, official price per share, performance-fee accounting, and the processing of eligible requests. Values displayed between reports are based on the latest completed report and may not represent a real-time liquidation value. See <a href=\"#accounting-metrics\">Accounting &amp; metrics</a>.</p>\n<h3>Why can the estimated pARB or USDC output change?</h3>\n<p>Deposit and redemption previews are estimates based on the vault state available when the preview is generated. A new report, updated PPS, processed requests, realized profit or loss, or a change in available liquidity may occur before the request is processed. The final amount can therefore differ from the initial preview.</p>\n<h3>What does the expected APR represent?</h3>\n<p>Expected APR is an annualized estimate based on the vault's current or recently observed strategy conditions. It is not a fixed interest rate and does not represent a guaranteed future return. It may change as spreads, trading costs, capital utilization, position duration, venue incentives, or vault performance change. A short-duration opportunity can display a high annualized rate even when its absolute profit is relatively small.</p>\n<h3>What is the high-water mark?</h3>\n<p>The high-water mark tracks the highest level of vault value on which performance fees have already been applied. The 20% performance fee is charged only on new profit above the applicable high-water mark. This is designed to prevent the protocol from charging the same performance fee repeatedly on previously recognized gains. See <a href=\"#accounting-metrics\">Accounting &amp; metrics</a>.</p>\n<h3>Does a pending deposit participate immediately?</h3>\n<p>No pARB shares are issued until the deposit request is processed through a vault report. Before processing, the deposit remains pending. Once processed, the corresponding pARB shares are issued to the receiver based on the applicable deposit PPS.</p>\n<h3>Does pARB pay interest directly?</h3>\n<p>No separate interest payment is distributed merely for holding pARB. Vault performance is reflected through changes in the official pARB price per share. When a user redeems pARB, the redemption amount is calculated using the applicable official PPS.</p>\n<h2 id=\"faq-liquidity\">FAQ: liquidity &amp; withdrawals</h2>\n<h3>Is there a fixed lock-up period?</h3>\n<p>pARB does not use a conventional fixed-term maturity, but redemption is asynchronous rather than instant. A user can submit a redemption request while the vault is accepting requests. Processing then depends on a vault report, the request's position in the FIFO queue, and available spendable USDC.</p>\n<h3>Why can a redemption take longer than a deposit?</h3>\n<p>Part of the vault's capital may be committed to prediction-market positions that have not yet settled. Redemptions are first funded using available vault liquidity. The vault does not automatically close otherwise valid open positions solely to satisfy every new redemption request. This avoids potentially realizing losses through premature exits, but it can increase withdrawal time. See <a href=\"#liquidity-management\">Liquidity management</a>.</p>\n<h3>Does submitting a redemption guarantee processing in the next report?</h3>\n<p>No. The next report may recognize the request without fully processing it if the vault does not have enough spendable USDC. Eligible redemptions remain in FIFO order and are processed as liquidity becomes available.</p>\n<h3>Is idle USDC a guarantee that my redemption will be processed?</h3>\n<p>No. The idle USDC displayed by the app is informational. Some funds may be reserved for previously processed claims, pending accounting actions, operational requirements, or earlier redemption requests. Final processing remains subject to the vault report and liquidity waterfall.</p>\n<h2 id=\"faq-security\">FAQ: operation &amp; security</h2>\n<h3>Is the entire strategy executed onchain?</h3>\n<p>User requests, pARB balances, vault accounting, and claims are recorded through the vault contract on Base. However, the arbitrage strategy also interacts with external prediction-market venues. Capital used for strategy execution may therefore be exposed to venue custody, account access, operational, counterparty, settlement, and withdrawal risks in addition to Base smart-contract risk.</p>\n<h3>Which USDC does the vault accept?</h3>\n<p>The vault accepts native USDC on Base: <span class=\"inline-flex items-center gap-2\"><code>0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></p>\n<p>Users should verify the network and token contract before approving or submitting a deposit. Bridged or similarly named assets are not accepted unless explicitly documented.</p>\n<h3>Do I need ETH to use the vault?</h3>\n<p>Yes. A small amount of ETH on Base is required to pay network gas for actions such as approving USDC, requesting a deposit, requesting a redemption, cancelling an eligible stale request, or claiming funds when a separate claim transaction is required.</p>\n<h3>Is there a minimum deposit or vault cap?</h3>\n<p>Yes. The vault contract enforces an onchain minimum deposit and a maximum deposit capacity. Deposits below the current minimum or above the vault's remaining capacity are rejected. Because these parameters may change, users should verify the current values in the app or directly through the vault contract before depositing.</p>\n</article>", "strategy-logic": "<article class=\"docs-article max-w-[820px]\"><h1>Strategy logic</h1><p>The pArbitrage strategy searches for paired YES and NO exposure across supported prediction market venues.</p><h2 id=\"supported-venues\">Supported venues</h2><p>The strategy currently supports:</p><table><thead><tr><th>Venue</th><th>Status</th><th>Used for</th></tr></thead><tbody><tr><td>Polymarket</td><td>Supported</td><td>Market data and execution</td></tr><tr><td>Kalshi</td><td>Supported</td><td>Market data and execution</td></tr><tr><td>Opinion</td><td>Supported</td><td>Market data and execution</td></tr></tbody></table><p>PMFI may add additional supported venues over time.</p><p>Venue expansion depends on liquidity, API reliability, settlement process, execution quality, supported market structure, and operational risk.</p><h2 id=\"venue-accounts\">Venue accounts</h2><p>PMFI provides public venue profiles where available so users can review account-level activity alongside live vault positions.</p><table><thead><tr><th>Venue</th><th>Profile</th><th>Notes</th></tr></thead><tbody><tr><td>Polymarket</td><td><a href=\"https://polymarket.com/@pmfi3\" target=\"_blank\" rel=\"noopener noreferrer\">Open profile</a></td><td>Public PMFI Polymarket profile</td></tr><tr><td>Opinion</td><td><a href=\"https://www.opinion.trade/profile?address=0x61068AbfB8349f90bd0bAb12347ec10e0C55C20f\" target=\"_blank\" rel=\"noopener noreferrer\">Open profile</a></td><td>Public PMFI Opinion profile</td></tr><tr><td>Kalshi</td><td><a href=\"https://kalshi.com/ideas/profiles/pmfi\" target=\"_blank\" rel=\"noopener noreferrer\">Open profile</a></td><td>PMFI Kalshi profile</td></tr></tbody></table><h2 id=\"kalshi-trade-verification\">Kalshi trade verification</h2><p>Kalshi does not provide a fully public individual trading profile with complete net worth, ROI, or full transaction history.</p><p>PMFI publishes live positions in the app. To verify a Kalshi-side execution, users can open the specific Kalshi market and review the market activity tab for recent executed trades around the displayed execution time and price.</p><h2 id=\"market-pairing\">Market pairing</h2><p>The strategy first looks for equivalent or highly similar prediction markets across supported venues.</p><p>A valid pair requires both markets to represent the same underlying event and compatible resolution logic.</p><table><thead><tr><th>Leg</th><th>Venue</th><th>Exposure</th></tr></thead><tbody><tr><td>Leg 1</td><td>Polymarket</td><td>YES or NO</td></tr><tr><td>Leg 2</td><td>Kalshi / Opinion</td><td>Opposite side</td></tr></tbody></table><p>The goal is to build paired YES + NO exposure across venues.</p><p>The bot then checks whether the combined cost of both legs is below expected settlement value after fees, buffers, and execution checks.</p><p>Not every similar-looking market is eligible. PMFI may skip markets if titles, rules, resolution criteria, expiry, liquidity, or venue conditions are not compatible.</p><h2 id=\"core-arbitrage-condition\">Core arbitrage condition</h2><p>In a binary market:</p><pre class=\"docs-code-block\"><code>YES + NO = $1.00 at settlement</code></pre><p>A potential arbitrage exists when:</p><pre class=\"docs-code-block\"><code>combined_cost_after_fees &lt; $1.00</code></pre><p>Where:</p><pre class=\"docs-code-block\"><code>combined_cost_after_fees =\n  YES_entry_price\n+ NO_entry_price\n+ venue_fees\n+ execution_buffer</code></pre><p>The strategy should only execute when:</p><pre class=\"docs-code-block\"><code>1.00 - combined_cost_after_fees &gt; required_edge</code></pre><h2 id=\"vwap-check\">VWAP check</h2><p>VWAP means volume-weighted average price.</p><p>It estimates the average price the bot would pay if it filled the target size across available order book liquidity.</p><pre class=\"docs-code-block\"><code>VWAP = total_cost / filled_contracts</code></pre><p>PMFI uses VWAP checks because the best visible price may only be available for a small size. A trade can look profitable at the top of the book but become unprofitable when filled across deeper liquidity.</p><h2 id=\"valid-opportunity\">Valid opportunity</h2><table><thead><tr><th>Requirement</th><th>Description</th></tr></thead><tbody><tr><td>Compatible paired exposure</td><td>YES and NO exposure must be compatible across paired markets.</td></tr><tr><td>Combined cost</td><td>Combined cost must be below $1 after fees.</td></tr><tr><td>Live liquidity</td><td>Supported venues must have sufficient executable depth.</td></tr><tr><td>VWAP check</td><td>Matched-size VWAP must pass profitability checks.</td></tr><tr><td>Safety buffer</td><td>Net edge must exceed required edge threshold.</td></tr><tr><td>Capital limits</td><td>Per-pair and total deployed caps must be respected.</td></tr></tbody></table><h2 id=\"execution-behavior\">Execution behavior</h2><p>If pricing is not favorable, the vault should not open the position.</p><p>If pricing is favorable, the executor may attempt to open both legs.</p><h2 id=\"failed-second-leg-handling\">Failed second-leg handling</h2><p>If the first leg executes and the second leg does not immediately fill, PMFI does not automatically unwind as the first action.</p><p>The handling sequence is:</p><ol><li>Retry second-leg execution.</li><li>Re-fetch the live order book.</li><li>Check whether the second leg can still be filled while keeping the combined trade profitable.</li><li>If the second leg is partially filled, attempt to complete the missing hedge.</li><li>Use unwind only as a last-resort option if completing the hedge would no longer be profitable or safe.</li></ol><p>PMFI avoids unnecessary unwinds because unwinding can create extra fees, slippage, and execution loss.</p><h2 id=\"execution-failure-cases\">Execution failure cases</h2><p>Execution may fail, partially fill, retry, reprice, hedge, unwind, or be skipped due to:</p><ul><li>insufficient live liquidity</li><li>stale opportunity data</li><li>VWAP edge below threshold</li><li>price movement</li><li>per-pair cap</li><li>total deployed cap</li><li>insufficient deployable capital</li></ul></article>", "accounting-metrics": "<article class=\"docs-article max-w-[820px]\"><h1>Accounting &amp; metrics</h1><p>This page explains how PMFI handles vault accounting, PPS, deposits, redemptions, performance fees, TVL, APR, APY, and open pair data.</p><div class=\"docs-callout\"><strong>Estimate:</strong> APR and APY are estimates. Vault performance is not guaranteed.</div><h2 id=\"precision\">Precision</h2><p>The contract uses:</p><pre class=\"docs-code-block\"><code>NAV_PRECISION = 1e18</code></pre><p>USDC uses 6 decimals. Base USDC is <span class=\"inline-flex items-center gap-2\"><code>0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span>.</p><p>The initial vault price is:</p><pre class=\"docs-code-block\"><code>INITIAL_PPS = 1e6</code></pre><p>This represents:</p><pre class=\"docs-code-block\"><code>$1.00 per 1e18 pARB shares</code></pre><h2 id=\"official-pps\">Official PPS</h2><p>The vault stores an official price per share:</p><pre class=\"docs-code-block\"><code>officialPPS</code></pre><p>It is updated only during a valid <code>report()</code>.</p><h2 id=\"report-data\">Report data</h2><pre class=\"docs-code-block\"><code>struct ReportData {\n    uint256 reportedAssets;\n    uint256 timestamp;\n    uint256 deadline;\n    uint256 nonce;\n}</code></pre><p>The signed report includes:</p><ul><li>reportedAssets</li><li>timestamp</li><li>deadline</li><li>nonce</li><li>vault address</li><li>chain ID</li><li>domain salt</li></ul><h2 id=\"backing-assets\">Backing assets</h2><pre class=\"docs-code-block\"><code>deductions =\n  totalPendingDepositAssets\n+ totalClaimableRedeemAssets</code></pre><pre class=\"docs-code-block\"><code>backingAssetsNow =\n  reportedAssets &gt; deductions\n    ? reportedAssets - deductions\n    : 0</code></pre><h2 id=\"high-water-mark\">High-water mark</h2><p>The contract tracks:</p><pre class=\"docs-code-block\"><code>highWaterMarkAssets</code></pre><p>Profit above the high-water mark is calculated as:</p><pre class=\"docs-code-block\"><code>profitAboveHWM =\n  backingAssetsNow - highWaterMarkAssets</code></pre><p>If <code>backingAssetsNow</code> is below the high-water mark, the value is negative and no performance fee is charged.</p><h2 id=\"when-profit-is-recognized\">When profit is recognized</h2><p>For PMFI accounting, protocol profit is recognized when settled value is reflected in reported assets.</p><p>The strategy may hold open paired positions before settlement. Expected edge may be visible in app metrics, but official protocol profit is only reflected when settlement proceeds or realized value are included in reported assets.</p><p>Performance fees are not taken from unrealized expected edge.</p><p>Performance fees are applied only when reported backing assets exceed the previous high-water mark.</p><h2 id=\"performance-fee-model\">Performance fee model</h2><p>PMFI charges a 20% performance fee on profit above the high-water mark.</p><p>The fee is not taken as a direct USDC transfer during normal reporting.</p><p>Instead, the protocol mints new pARB shares to the fee recipient.</p><p>This means the fee is paid through share dilution.</p><pre class=\"docs-code-block\"><code>feeAssets = profitAboveHWM × PERF_FEE_BPS / 10,000</code></pre><p><code>10,000</code> is the basis-points denominator.</p><pre class=\"docs-code-block\"><code>100% = 10,000 bps\n20% = 2,000 bps</code></pre><p>And the contract uses:</p><pre class=\"docs-code-block\"><code>PERF_FEE_BPS = 2000</code></pre><p>The fee is:</p><pre class=\"docs-code-block\"><code>feeAssets = profitAboveHWM × 2000 / 10000</code></pre><p>Which equals:</p><pre class=\"docs-code-block\"><code>20% of profit above the high-water mark</code></pre><p>Fee shares are then minted:</p><pre class=\"docs-code-block\"><code>feeShares =\n  feeAssets × outstandingShares\n  / (backingAssetsNow - feeAssets)</code></pre><h2 id=\"new-official-pps\">New official PPS</h2><pre class=\"docs-code-block\"><code>netBacking =\n  backingAssetsNow &gt; feeAssets\n    ? backingAssetsNow - feeAssets\n    : backingAssetsNow</code></pre><pre class=\"docs-code-block\"><code>newPPS =\n  outstandingShares &gt; 0\n    ? netBacking × NAV_PRECISION / outstandingShares\n    : INITIAL_PPS</code></pre><p>If <code>newPPS == 0</code>, the contract sets:</p><pre class=\"docs-code-block\"><code>newPPS = INITIAL_PPS</code></pre><p>Then:</p><pre class=\"docs-code-block\"><code>officialPPS = newPPS</code></pre><h2 id=\"deposit-pricing\">Deposit pricing</h2><p>Deposits are processed at the higher of current PPS or the initial $1.00 PPS.</p><pre class=\"docs-code-block\"><code>depositPPS = max(currentPPS, INITIAL_PPS)</code></pre><p>This means users deposit at:</p><ul><li>$1.00 PPS if current PPS is below $1.00</li><li>current PPS if current PPS is above $1.00</li></ul><p>Shares are minted as:</p><pre class=\"docs-code-block\"><code>shares = depositAmount × NAV_PRECISION / depositPPS</code></pre><p>This prevents below-$1 deposit entry and protects existing holders from dilution.</p><h2 id=\"redemption-pricing\">Redemption pricing</h2><p>Redemptions use <code>officialPPS</code>.</p><pre class=\"docs-code-block\"><code>lockedAssets = shares × officialPPS / NAV_PRECISION</code></pre><h2 id=\"tvl\">TVL</h2><p>The app displays TVL from PMFI vault accounting data.</p><pre class=\"docs-code-block\"><code>TVL = total_assets_usdc</code></pre><p><code>total_assets_usdc</code> may include:</p><ul><li>USDC held in the vault</li><li>USDC held by the servicer wallet</li><li>USDC balances on supported venues</li><li>value assigned to open positions</li><li>settled proceeds awaiting transfer or reporting</li></ul><p>TVL combines vault contract state, onchain-verifiable balances, public venue positions where available, and PMFI-reported venue balances.</p><p>Polymarket and Opinion activity can be reviewed through public venue profiles where available.</p><p>Kalshi is an offchain regulated venue, so Kalshi balances and executions are reported by PMFI. Users can cross-check Kalshi-side execution against live PMFI positions and recent trade activity on the relevant Kalshi market.</p><h2 id=\"apr\">APR</h2><pre class=\"docs-code-block\"><code>gross_return = expected_payout / cost_basis - 1\n\nexpected_payout = shares × 1.00\n\ngross_return = shares / cost_basis_usdc - 1\n\nAPR = gross_return × (365 / days_to_settlement)\n\nAPR_pct = APR × 100</code></pre><h2 id=\"apy\">APY</h2><pre class=\"docs-code-block\"><code>APY = (1 + gross_return) ^ (365 / days_to_settlement) - 1\n\nAPY_pct = APY × 100</code></pre><h2 id=\"open-pairs\">Open pairs</h2><p>Open pairs are active paired positions held by the vault.</p><table><thead><tr><th>Field</th><th>Meaning</th></tr></thead><tbody><tr><td><code>pair_id</code></td><td>Internal market pair identifier</td></tr><tr><td><code>shares</code></td><td>Number of contracts held</td></tr><tr><td><code>poly_side</code></td><td>Polymarket side purchased</td></tr><tr><td><code>poly_entry_price</code></td><td>Polymarket entry price</td></tr><tr><td><code>kalshi_side</code></td><td>Kalshi side purchased, if applicable</td></tr><tr><td><code>kalshi_entry_price</code></td><td>Kalshi entry price, if applicable</td></tr><tr><td><code>opinion_side</code></td><td>Opinion side purchased, if applicable</td></tr><tr><td><code>opinion_entry_price</code></td><td>Opinion entry price, if applicable</td></tr><tr><td><code>cost_basis_usdc</code></td><td>Stored total cost basis</td></tr><tr><td><code>expiry_ts</code></td><td>Expected settlement timestamp</td></tr><tr><td><code>status</code></td><td>Position status</td></tr><tr><td><code>estimated_apr</code></td><td>Annualized return estimate</td></tr></tbody></table><h2 id=\"reporting-policy\">Reporting policy</h2><p>PMFI uses report-based accounting.</p><p>A report updates official PPS, processes pending deposits, processes pending redemptions, and applies performance fees when applicable.</p><h3>Normal report behavior</h3><p>A valid report may be submitted when:</p><ul><li>report cooldown has passed</li><li>report data is signed by the report signer</li><li>report data is not expired</li><li>report nonce is higher than the previous nonce</li></ul><h3>Report postponement</h3><p>PMFI may postpone a report if reported assets are unexpectedly lower or higher than expected and there are no user deposits or redemptions requiring processing.</p><p>This is intended to avoid updating official PPS or triggering performance fees from temporary reporting noise, stale venue balances, bridge delays, API issues, or incomplete offchain reconciliation.</p><h3>Important note</h3><p>Report postponement is an operational policy. It does not change the smart contract rules.</p><p>A valid onchain report still controls official PPS updates, request processing, and performance fee logic.</p></article>", "user-flow": "<article class=\"docs-article max-w-[820px]\"><h1>User flow</h1><p>PMFI uses asynchronous deposit and redemption requests.</p><p>Users do not receive shares or USDC immediately when they submit a request. Requests are processed through the vault’s report-based accounting system.</p><h2 id=\"deposit-pricing\">Deposit pricing</h2><p>Deposits are processed at the higher of current PPS or the initial $1.00 PPS.</p><pre class=\"docs-code-block\"><code>depositPPS = max(currentPPS, INITIAL_PPS)</code></pre><p>This means users deposit at:</p><ul><li>$1.00 PPS if current PPS is below $1.00</li><li>current PPS if current PPS is above $1.00</li></ul><p>Shares are minted as:</p><pre class=\"docs-code-block\"><code>shares = depositAmount × NAV_PRECISION / depositPPS</code></pre><p>This prevents below-$1 deposit entry and protects existing holders from dilution.</p><h2 id=\"deposit-flow\">Deposit flow</h2><h3>1. User submits deposit request</h3><p>The user submits a deposit transaction with USDC.</p><pre class=\"docs-code-block\"><code>requestDeposit(uint256 assets, address receiver)</code></pre><p>Requirements:</p><pre class=\"docs-code-block\"><code>assets &gt;= MIN_DEPOSIT_USDC\nreceiver != address(0)\nvault cap is not exceeded</code></pre><p>The vault transfers USDC from the user and records a pending deposit request.</p><h3>2. Report processes the deposit request</h3><p>A valid report processes pending deposit requests.</p><p>The deposit is priced at:</p><pre class=\"docs-code-block\"><code>depositPPS = max(currentReportPPS, INITIAL_PPS)</code></pre><p>The request becomes claimable.</p><h3>3. Keeper automation claims shares</h3><p>After the request becomes claimable, keeper automation may call:</p><pre class=\"docs-code-block\"><code>autoClaimDeposits(uint256[] requestIds)</code></pre><p>Shares are minted to the receiver:</p><pre class=\"docs-code-block\"><code>shares = assets × NAV_PRECISION / depositPPS</code></pre><h3>4. Manual fallback</h3><p>If automation does not complete the claim, the request owner may call:</p><pre class=\"docs-code-block\"><code>claimDeposit(uint256 requestId, address receiver)</code></pre><h2 id=\"redeem-flow\">Redeem flow</h2><h3>1. User submits redemption request</h3><p>The user submits a redemption transaction with pARB shares.</p><pre class=\"docs-code-block\"><code>requestRedeem(uint256 shares, address receiver)</code></pre><p>The vault transfers the user’s pARB shares into the vault and records a pending redeem request.</p><p>Redemptions are priced at the current official PPS.</p><p>The redeem amount is calculated using current official PPS:</p><pre class=\"docs-code-block\"><code>lockedAssets = shares × officialPPS / NAV_PRECISION</code></pre><h3>2. Report processes the redeem request</h3><p>A valid report processes pending redeem requests in FIFO order if sufficient spendable vault liquidity is available.</p><p>The request becomes claimable when the vault has enough spendable USDC.</p><h3>3. Keeper automation pays USDC</h3><p>After the request becomes claimable, keeper automation may call:</p><pre class=\"docs-code-block\"><code>autoClaimRedeems(uint256[] requestIds)</code></pre><p>The vault transfers claimable USDC to the receiver.</p><h3>4. Manual fallback</h3><p>If automation does not complete the claim, the request owner may call:</p><pre class=\"docs-code-block\"><code>claimRedeem(uint256 requestId, address receiver)</code></pre><h2 id=\"automated-claim-flow\">Automated claim flow</h2><p>After a deposit or redeem request is processed by a report, PMFI may automatically claim it through keeper automation.</p><p>For deposits, this means pARB shares can be automatically minted to the user’s receiver address after the request becomes claimable.</p><p>For redemptions, this means claimable USDC can be automatically transferred to the user’s receiver address after the request becomes claimable.</p><p>Users normally only need to submit:</p><ul><li>a deposit request</li><li>or a redemption request</li></ul><p>The rest of the flow may be completed automatically by PMFI keeper automation.</p><h2 id=\"manual-fallback\">Manual fallback</h2><p>If automation does not complete the claim, the request owner may still use the claim function directly where supported by the contract.</p><h2 id=\"cancel-stale-request\">Cancel stale request</h2><p>If a request remains pending longer than:</p><pre class=\"docs-code-block\"><code>MAX_REQUEST_AGE = 30 days</code></pre><p>the request owner can call:</p><pre class=\"docs-code-block\"><code>cancelRequest(uint256 requestId, bool isDeposit)</code></pre><p>For stale deposit requests, USDC is returned to the user.</p><p>For stale redeem requests, locked pARB shares are returned to the user.</p></article>", "liquidity-management": "<article class=\"docs-article max-w-[820px]\"><h1>Liquidity management</h1><p>The pArbitrage Vault keeps idle USDC in the vault and transfers deployable excess USDC to the arb servicer wallet through <code>tend()</code>.</p><p><code>tend()</code> is permissionless, but it does not change official accounting.</p><h2 id=\"idle-balance\">Idle balance</h2><pre class=\"docs-code-block\"><code>idleBalance =\n  usdc.balanceOf(vault)\n- totalPendingDepositAssets\n- totalClaimableRedeemAssets</code></pre><p>If vault balance is less than reserved assets:</p><pre class=\"docs-code-block\"><code>idleBalance = 0</code></pre><h2 id=\"target-idle\">Target idle</h2><pre class=\"docs-code-block\"><code>targetIdle =\n  max(\n    lastReportedBackingAssets × targetIdleBps / 10,000,\n    minimumIdleAmount\n  )</code></pre><table><thead><tr><th>Parameter</th><th>Value</th></tr></thead><tbody><tr><td><code>targetIdleBps</code></td><td><code>1000</code></td></tr><tr><td>Target idle percentage</td><td>10%</td></tr><tr><td><code>minimumIdleAmount</code></td><td><code>1e6</code></td></tr><tr><td>Minimum idle amount</td><td>1 USDC</td></tr><tr><td><code>tendCooldown</code></td><td>60 seconds</td></tr><tr><td><code>reportCooldown</code></td><td>3600 seconds</td></tr></tbody></table><h2 id=\"redemption-reserve\">Redemption reserve</h2><pre class=\"docs-code-block\"><code>redemptionReserve = totalPendingRedeemShares × officialPPS / NAV_PRECISION</code></pre><h2 id=\"total-reserve\">Total reserve</h2><pre class=\"docs-code-block\"><code>totalReserve =\n  redemptionReserve\n+ targetIdle</code></pre><h2 id=\"deployable-amount\">Deployable amount</h2><pre class=\"docs-code-block\"><code>deployable =\n  idleBalance &gt; totalReserve\n    ? idleBalance - totalReserve\n    : 0</code></pre><p>If <code>deployable &gt; 0</code>, <code>tend()</code> transfers deployable USDC to:</p><pre class=\"docs-code-block\"><code>arbServicerWallet</code></pre><h2 id=\"redemption-repayment-order\">Redemption repayment order</h2><p>When redemptions need to be paid, PMFI prioritizes available liquidity before touching open positions.</p><p>The operational repayment order is:</p><ol><li>Vault idle USDC</li><li>Servicer wallet USDC</li><li>Polymarket USDC balance</li><li>Kalshi balance</li><li>Opinion balance</li><li>Settled venue proceeds</li></ol><p>PMFI does not normally sell open arbitrage positions before resolution date.</p><p>Open positions are expected to resolve at settlement rather than being force-sold for routine redemptions.</p></article>", "spread-intelligence-api": "<article class=\"docs-article max-w-[820px]\"><h1>Spread Intelligence API</h1><p>PMFI Spread Intelligence provides paid x402 access to actionable cross-market prediction-market spread signals for autonomous agents and applications.</p><p>Agents receive market, outcome, YES leg platform, NO leg platform, route identifiers, edge, projected APR, deployable liquidity, projected profit, fees, fillable contracts, and freshness metadata.</p><h2 id=\"endpoint\">Endpoints</h2><p>The same spread intelligence is available through two x402 endpoints.</p><p><strong>Self-hosted (Coinbase CDP)</strong> &mdash; PMFI's own x402 endpoint, built on <a href=\"https://x.com/CoinbaseDev\" target=\"_blank\" rel=\"noopener noreferrer\">Coinbase Developer Platform (CDP)</a>:</p><pre class=\"docs-code-block\"><code>https://x402.pmfi.cc/api/x402/spread-intelligence</code></pre><p><strong>Bankr</strong> &mdash; hosted through the Bankr x402 gateway:</p><pre class=\"docs-code-block\"><code>https://x402.bankr.bot/0x7e5f1530554d021a66b412972720e050a7a433c9/spread-intelligence</code></pre><h2 id=\"price-and-network\">Price and network</h2><table><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Price</td><td>$0.05 USDC per successful request</td></tr><tr><td>Network</td><td>Base</td></tr><tr><td>Payment standard</td><td>x402</td></tr></tbody></table><h2 id=\"skills\">Skills</h2><ul><li>Discover actionable cross-market spread signals</li><li>Rank signals by edge</li><li>Rank signals by projected APR</li><li>Rank signals by projected profit</li><li>Rank signals by deployable liquidity</li><li>Filter by minimum edge</li><li>Filter by minimum projected APR</li><li>Filter by minimum deployable liquidity</li><li>Filter by minimum projected profit</li><li>Limit returned signals</li></ul><h2 id=\"query-parameters\">Query parameters</h2><table><thead><tr><th>Parameter</th><th>Description</th></tr></thead><tbody><tr><td><code>sort</code></td><td>Ranking method: <code>edge</code>, <code>apr</code>, <code>profit</code>, or <code>capital</code></td></tr><tr><td><code>limit</code></td><td>Maximum number of signals to return</td></tr><tr><td><code>min_edge</code></td><td>Minimum edge percentage</td></tr><tr><td><code>min_apr</code></td><td>Minimum projected APR percentage</td></tr><tr><td><code>min_capital</code></td><td>Minimum deployable liquidity in USDC</td></tr><tr><td><code>min_profit</code></td><td>Minimum projected profit in USDC</td></tr></tbody></table><h2 id=\"quickstart\">Quickstart</h2><p>Install and log in to Bankr CLI, then call the x402 endpoint.</p><pre class=\"docs-code-block\"><code>npm install -g @bankr/cli\nbankr login\n\nexport PMFI_X402_URL=\"https://x402.bankr.bot/0x7e5f1530554d021a66b412972720e050a7a433c9/spread-intelligence\"\n\nbankr x402 schema \"$PMFI_X402_URL\"\n\nbankr x402 call \"$PMFI_X402_URL?sort=edge&amp;min_edge=2&amp;min_apr=5&amp;min_capital=100&amp;min_profit=5&amp;limit=10\"</code></pre><h2 id=\"example-requests\">Example requests</h2><pre class=\"docs-code-block\"><code># Highest edge signals\nbankr x402 call \"$PMFI_X402_URL?sort=edge&amp;min_edge=2&amp;limit=10\"\n\n# Highest projected APR signals\nbankr x402 call \"$PMFI_X402_URL?sort=apr&amp;min_apr=10&amp;limit=10\"\n\n# Highest projected profit signals\nbankr x402 call \"$PMFI_X402_URL?sort=profit&amp;min_profit=10&amp;limit=10\"\n\n# Highest deployable liquidity signals\nbankr x402 call \"$PMFI_X402_URL?sort=capital&amp;min_capital=500&amp;limit=10\"</code></pre><h2 id=\"response-fields\">Response fields</h2><table><thead><tr><th>Field</th><th>Description</th></tr></thead><tbody><tr><td><code>pmfi_signal_id</code></td><td>PMFI signal identifier</td></tr><tr><td><code>rank</code></td><td>Signal rank in the response</td></tr><tr><td><code>market_title</code></td><td>Market title</td></tr><tr><td><code>outcome</code></td><td>Outcome attached to the signal</td></tr><tr><td><code>metrics.edge_pct</code></td><td>Cross-market edge percentage</td></tr><tr><td><code>metrics.apr_pct</code></td><td>Projected APR percentage</td></tr><tr><td><code>metrics.deployable_liquidity_usdc</code></td><td>Estimated deployable liquidity in USDC</td></tr><tr><td><code>metrics.projected_profit_usdc</code></td><td>Estimated projected profit in USDC</td></tr></tbody></table><h2 id=\"raw-unpaid-request\">Raw unpaid request</h2><p>A normal unpaid HTTP request should return 402 Payment Required. To receive data, use Bankr CLI or another x402-compatible client.</p><pre class=\"docs-code-block\"><code>curl -i \"$PMFI_X402_URL?sort=edge&amp;min_edge=2&amp;min_apr=5&amp;min_capital=100&amp;min_profit=5&amp;limit=10\"</code></pre><h2 id=\"important-notes\">Important notes</h2><ul><li>PMFI Spread Intelligence is informational only.</li><li>The API does not execute trades.</li><li>The API does not guarantee profit.</li><li>Signals can change as market prices, liquidity, fees, and timing change.</li><li>No PMFI internal API key is required to consume the x402 endpoint.</li></ul></article>", "virtuals-acp-integration": "<article class=\"docs-article max-w-[820px]\"><h1>Virtuals ACP Integration</h1><p>PMFI Spread Intelligence is available as a Virtuals ACP job offering. Agents can buy getPMFISpreadSignals and receive actionable cross-market prediction-market spread intelligence through the Virtuals ACP job flow.</p><p><strong>Virtuals agent page: </strong><a href=\"https://app.virtuals.io/acp/agent/019e8981-50e1-7dd1-b0a0-f49503ce4c7b\" target=\"_blank\" rel=\"noopener noreferrer\">https://app.virtuals.io/acp/agent/019e8981-50e1-7dd1-b0a0-f49503ce4c7b</a></p><h2 id=\"offering\">Offering</h2><table><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Provider</td><td>PMFI Spread Intelligence</td></tr><tr><td>Offering name</td><td><code>getPMFISpreadSignals</code></td></tr><tr><td>Price</td><td>0.05 USDC per job</td></tr><tr><td>Network</td><td>Base</td></tr><tr><td>Payment flow</td><td>Virtuals ACP job flow</td></tr><tr><td>Provider wallet</td><td><code>0xb3682fb89b17896e5cd393d978edfd945b4796de</code></td></tr></tbody></table><h2 id=\"what-the-agent-receives\">What the agent receives</h2><p>PMFI returns structured JSON with actionable spread intelligence, including market, outcome, YES leg platform, NO leg platform, route identifiers, edge, projected APR, deployable liquidity, projected profit, estimated fees, fillable contracts, days to resolution, and freshness metadata.</p><p>The response is designed to show not only that a spread exists, but where it exists, what route is implied, how much liquidity can be deployed, what fees matter, and how fresh the signal is.</p><h2 id=\"request-schema\">Request schema</h2><table><thead><tr><th>Parameter</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>sort</code></td><td>string</td><td>Ranking method: edge, apr, profit, or capital</td></tr><tr><td><code>limit</code></td><td>integer</td><td>Maximum number of signals to return</td></tr><tr><td><code>min_edge</code></td><td>number</td><td>Minimum edge percentage</td></tr><tr><td><code>min_apr</code></td><td>number</td><td>Minimum projected APR percentage</td></tr><tr><td><code>min_capital</code></td><td>number</td><td>Minimum deployable liquidity in USDC</td></tr><tr><td><code>min_profit</code></td><td>number</td><td>Minimum projected profit in USDC</td></tr></tbody></table><h2 id=\"example-requirement\">Example requirement</h2><pre class=\"docs-code-block\"><code>{\n  \"sort\": \"profit\",\n  \"min_profit\": 10,\n  \"min_capital\": 100,\n  \"limit\": 3\n}</code></pre><h2 id=\"install-virtuals-acp-sdk\">Install Virtuals ACP SDK</h2><pre class=\"docs-code-block\"><code>npm install @virtuals-protocol/acp-node-v2 viem @account-kit/infra</code></pre><h2 id=\"buyer-example\">Buyer example</h2><pre class=\"docs-code-block\"><code>import {\n  AcpAgent,\n  PrivyAlchemyEvmProviderAdapter,\n  AssetToken,\n} from \"@virtuals-protocol/acp-node-v2\";\nimport { base } from \"@account-kit/infra\";\n\nconst PMFI_PROVIDER_WALLET =\n  \"0xb3682fb89b17896e5cd393d978edfd945b4796de\";\n\nconst OFFERING_NAME = \"getPMFISpreadSignals\";\n\nasync function main() {\n  const buyer = await AcpAgent.create({\n    provider: await PrivyAlchemyEvmProviderAdapter.create({\n      walletAddress: process.env.BUYER_WALLET_ADDRESS,\n      walletId: process.env.BUYER_WALLET_ID,\n      signerPrivateKey: process.env.BUYER_SIGNER_PRIVATE_KEY,\n      chains: [base],\n      builderCode: process.env.BUYER_BUILDER_CODE || undefined,\n    }),\n  });\n\n  const buyerAddress = await buyer.getAddress();\n\n  buyer.on(\"entry\", async (session, entry) =&gt; {\n    if (entry.kind !== \"system\") return;\n\n    if (entry.event.type === \"budget.set\") {\n      await session.fund(AssetToken.usdc(0.05, session.chainId));\n    }\n\n    if (entry.event.type === \"job.submitted\") {\n      console.log(await session.toContext());\n      await session.complete(\"PMFI spread intelligence received.\");\n    }\n\n    if (entry.event.type === \"job.completed\") {\n      console.log(\"PMFI job completed\");\n      await buyer.stop();\n    }\n  });\n\n  await buyer.start();\n\n  const requirement = {\n    sort: \"profit\",\n    min_profit: 10,\n    min_capital: 100,\n    limit: 3,\n  };\n\n  const jobId = await buyer.createJobByOfferingName(\n    base.id,\n    OFFERING_NAME,\n    PMFI_PROVIDER_WALLET,\n    requirement,\n    {\n      evaluatorAddress: buyerAddress,\n    }\n  );\n\n  console.log(\"Created PMFI job:\", jobId);\n}\n\nmain().catch(console.error);</code></pre><h2 id=\"acp-job-lifecycle\">ACP job lifecycle</h2><ol><li>buyer agent creates a job</li><li>PMFI receives the requirement</li><li>PMFI sets the job budget</li><li>buyer funds the job in USDC on Base</li><li>PMFI submits the spread-intelligence deliverable</li><li>buyer or evaluator completes the job</li></ol><h2 id=\"bankr-x402-vs-virtuals-acp\">Bankr x402 vs Virtuals ACP</h2><table><thead><tr><th>Access path</th><th>Best for</th><th>Payment model</th></tr></thead><tbody><tr><td>Bankr x402 endpoint</td><td>Direct pay-per-request API access</td><td>x402</td></tr><tr><td>Virtuals ACP job</td><td>Native Virtuals agent-to-agent commerce</td><td>ACP job flow</td></tr></tbody></table><h2 id=\"notes\">Notes</h2><ul><li>PMFI does not execute trades through this job.</li><li>PMFI returns spread intelligence and route data.</li><li>Signals can change as prices, liquidity, fees, and timing change.</li><li>Agents should verify venues, orderbooks, and execution assumptions before trading.</li><li>Freshness metadata is included in each response.</li></ul></article>", "risk-disclosure": "<article class=\"docs-article max-w-[820px]\"><h1>Risk disclosure</h1><div class=\"docs-callout\">PMFI is currently in beta. Vault performance is not guaranteed. Audit is pending.</div><h2 id=\"execution-risk\">Execution risk</h2><p>Automated execution may fail, partially fill, unwind, or be skipped.</p><p>Execution depends on live order books, venue availability, order placement, pricing checks, and executor infrastructure.</p><h2 id=\"settlement-risk\">Settlement risk</h2><p>Prediction market settlement may depend on venue rules, resolution timing, claim processes, and external event outcomes.</p><h2 id=\"smart-contract-risk\">Smart contract risk</h2><p>Vault contracts may contain bugs, vulnerabilities, or unexpected behavior.</p><h2 id=\"accounting-risk\">Accounting risk</h2><p>Vault accounting depends on report data, signed reports, offchain balances, open position valuation, and correct processing of deposits and redemptions.</p><h2 id=\"liquidity-risk\">Liquidity risk</h2><p>Redemptions may depend on idle liquidity, settled proceeds, platform balances, pending requests, and open positions.</p><h2 id=\"redemption-liquidity-risk\">Redemption liquidity risk</h2><p>Redemptions are designed to be paid from idle vault liquidity, servicer wallet USDC, platform balances, and settled proceeds.</p><p>PMFI does not normally sell open positions before resolution date.</p><p>If available liquidity is insufficient, redemption processing may be delayed until more liquidity becomes available or positions settle.</p><h2 id=\"operational-dependencies\">Operational dependencies</h2><p>PMFI may rely on:</p><ul><li>report signer</li><li>executor</li><li>servicer wallet</li><li>RPC provider</li><li>Polymarket API / CLOB</li><li>Kalshi API</li><li>Opinion API / CLOB</li><li>backend database</li><li>app API</li></ul><p>Failures or delays in these systems may affect execution, reporting, settlement, redemption processing, or displayed app metrics.</p><h2 id=\"known-limitations\">Known limitations</h2><table><thead><tr><th>Limitation</th><th>Impact</th></tr></thead><tbody><tr><td>Audit pending</td><td>Smart contract risk remains</td></tr><tr><td>Report-based accounting</td><td>PPS updates only when valid reports are submitted</td></tr><tr><td>Async deposits</td><td>Shares are not minted immediately after deposit request</td></tr><tr><td>Async redemptions</td><td>USDC is not transferred immediately after redemption request</td></tr><tr><td>Deposit PPS floor</td><td>Deposits cannot mint below <code>INITIAL_PPS</code></td></tr><tr><td>Execution depends on venues</td><td>Strategy availability depends on supported prediction markets</td></tr><tr><td>Execution may fail</td><td>Some opportunities may be skipped, retried, hedged, or unwound</td></tr><tr><td>APR / APY are estimates</td><td>Displayed returns may change</td></tr><tr><td>Open position valuation depends on implementation</td><td>Metrics may change if valuation method changes</td></tr><tr><td>Database dependency</td><td>App-level position data may be incomplete if DB writes fail</td></tr><tr><td>Liquidity constraints</td><td>Redemptions may depend on idle liquidity and settled proceeds</td></tr></tbody></table></article>", "risk-mitigation": "<article class=\"docs-article max-w-[820px]\"><h1>Risk mitigation</h1><h2 id=\"market-pairing-review\">Market pairing review</h2><p>PMFI checks that paired markets represent compatible event exposure before execution.</p><p>Markets may be skipped if event wording, expiry, settlement rules, or resolution logic are not compatible.</p><h2 id=\"vwap-based-execution-checks\">VWAP-based execution checks</h2><p>PMFI checks executable order book depth instead of relying only on top-of-book prices.</p><p>This helps reduce the risk of entering trades that look profitable only at a small displayed size.</p><h2 id=\"second-leg-recovery-logic\">Second-leg recovery logic</h2><p>If the second leg does not immediately fill, PMFI can retry execution, refresh the order book, and complete the hedge if the trade remains profitable.</p><p>Unwind is treated as a last-resort option.</p><h2 id=\"liquidity-haircut\">Liquidity haircut</h2><p>The strategy does not assume full venue liquidity is safely fillable.</p><p>By default, it uses only a fraction of the thinner leg’s liquidity:</p><pre class=\"docs-code-block\"><code>deployable_size = min(bottleneck_liquidity × ARB_FILLABLE_FRACTION, ARB_MAX_PAIR_USDC)</code></pre><h2 id=\"deposit-pps-floor\">Deposit PPS floor</h2><p>Deposits are processed at the higher of current PPS or the initial $1.00 PPS.</p><pre class=\"docs-code-block\"><code>depositPPS = max(currentPPS, INITIAL_PPS)</code></pre><p>This prevents below-$1 deposit entry and protects existing holders from dilution.</p><h2 id=\"report-postponement-policy\">Report postponement policy</h2><p>PMFI may postpone reporting when reported assets are unexpectedly higher or lower than expected and no user deposits or redemptions require immediate processing.</p><h2 id=\"redemption-liquidity-waterfall\">Redemption liquidity waterfall</h2><p>PMFI prioritizes available liquidity before touching open positions:</p><ol><li>Vault idle USDC</li><li>Servicer wallet USDC</li><li>Polymarket USDC balance</li><li>Kalshi balance</li><li>Opinion balance</li><li>Settled venue proceeds</li></ol><h2 id=\"no-routine-forced-selling\">No routine forced selling</h2><p>PMFI does not normally sell open arbitrage positions before resolution date.</p><p>Positions are generally expected to resolve through settlement.</p><h2 id=\"stale-quote-filter\">Stale quote filter</h2><p>The strategy skips opportunities if the quote is older than the configured stale quote threshold.</p><h2 id=\"capital-caps\">Capital caps</h2><p>PMFI applies per-pair and total deployed capital caps.</p><h2 id=\"high-water-mark-fees\">High-water-mark fees</h2><p>Performance fees are charged only on profit above the previous high-water mark.</p><p>No performance fee is charged during losses or recovery below the high-water mark.</p><h2 id=\"async-request-cancellation\">Async request cancellation</h2><p>If a deposit or redeem request remains pending longer than:</p><pre class=\"docs-code-block\"><code>MAX_REQUEST_AGE = 30 days</code></pre><p>the request owner may cancel the request.</p></article>", "contract-addresses": "<article class=\"docs-article max-w-[820px]\"><h1>Contract addresses</h1><p>Always verify contract addresses from official PMFI sources.</p><h2 id=\"base\">Base</h2><table><thead><tr><th>Contract</th><th>Address</th><th>Notes</th></tr></thead><tbody><tr><td>pArbitrage Vault V2</td><td><span class=\"inline-flex items-center gap-2\"><code>0xd1ccBc2Aa6e2f41817b62448089d4125E62df4fb</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td><td>Main pARB vault contract</td></tr><tr><td>USDC</td><td><span class=\"inline-flex items-center gap-2\"><code>0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td><td>Base USDC</td></tr><tr><td>Report signer</td><td><span class=\"inline-flex items-center gap-2\"><code>0x59D0461ec7C4688dd3DAab7Ea903d93d109dB9E0</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td><td>Signs ReportDataV2</td></tr><tr><td>Arb servicer wallet</td><td><span class=\"inline-flex items-center gap-2\"><code>0xEdae94A822582324f19c89a057d694d833E6A6F0</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td><td>Receives deployable USDC</td></tr><tr><td>Fee recipient</td><td><span class=\"inline-flex items-center gap-2\"><code>0x7C8d9ad4F51299b02755Ec13C018004008b45494</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td><td>Receives performance fee shares</td></tr></tbody></table><h2 id=\"verification\">Verification</h2><p>Before interacting with contracts:</p><ul><li>verify the domain is <code>pmfi.cc</code> or <code>docs.pmfi.cc</code></li><li>verify the vault address from this page</li><li>compare the contract address with BaseScan</li><li>do not use contract addresses from unofficial links</li></ul><h2 id=\"main-contract-functions\">Main contract functions</h2><table><thead><tr><th>Area</th><th>Functions</th></tr></thead><tbody><tr><td>Deposits</td><td><code>requestDeposit</code>, <code>claimDeposit</code>, <code>autoClaimDeposits</code></td></tr><tr><td>Redemptions</td><td><code>requestRedeem</code>, <code>claimRedeem</code>, <code>autoClaimRedeems</code></td></tr><tr><td>Accounting</td><td><code>report</code>, <code>getVaultState</code>, <code>effectiveDepositPPS</code></td></tr><tr><td>Liquidity</td><td><code>tend</code>, <code>refillBuffer</code>, <code>idleBalance</code></td></tr><tr><td>Admin</td><td><code>setPaused</code>, <code>setShutdown</code>, <code>setFeeRecipient</code>, <code>setArbServicerWallet</code></td></tr></tbody></table><h2 id=\"key-events\">Key events</h2><table><thead><tr><th>Event</th><th>Description</th></tr></thead><tbody><tr><td><code>DepositRequested</code></td><td>Deposit request created</td></tr><tr><td><code>DepositClaimed</code></td><td>pARB shares minted after deposit processing</td></tr><tr><td><code>RedeemRequested</code></td><td>Redemption request created</td></tr><tr><td><code>RedeemClaimed</code></td><td>USDC transferred after redemption processing</td></tr><tr><td><code>Reported</code></td><td>Official vault accounting updated</td></tr><tr><td><code>TendExecuted</code></td><td>Deployable idle USDC moved to servicer wallet</td></tr><tr><td><code>PerfFeeMinted</code></td><td>Performance fee shares minted</td></tr><tr><td><code>Paused</code></td><td>Vault pause status changed</td></tr><tr><td><code>Shutdown</code></td><td>Vault shutdown status changed</td></tr></tbody></table></article>", "oplend": "<article class=\"docs-article\">\n<span class=\"docs-eyebrow\">OpLend Protocol</span>\n<h1>OpLend</h1>\n<p>OpLend is PMFI's onchain fixed-term credit marketplace on Base. A borrower locks allowlisted collateral into a per-position vault and raises USDC by selling principal claim tokens to lenders. The borrower repays a fixed total by a set deadline, and claim tokens redeem at settlement.</p>\n<div class=\"docs-callout verify\"><strong>Reviewed release:</strong> The deployed contracts described here are OpLend V2.2. A published V2.2 security review is available on the <a href=\"#audit\">Audit</a> page.</div>\n<h2 id=\"how-it-works\">How it works</h2>\n<p>In plain terms: you lock collateral and it splits into two linked tokens &mdash; <strong>P</strong> for lenders and <strong>N</strong> for you. Lenders fund your position by buying P, and you repay by the deadline to unlock your collateral. There is no liquidation in between.</p>\n<div class=\"ol-hiw\">\n  <div class=\"ol-tabs\" role=\"tablist\">\n    <button type=\"button\" class=\"ol-tab active\" data-view=\"borrower\">For borrowers</button>\n    <button type=\"button\" class=\"ol-tab\" data-view=\"lender\">For lenders</button>\n  </div>\n  <div class=\"ol-view\" data-view=\"borrower\">\n    <div class=\"ol-split\">\n      <div class=\"ol-collateral\">Your collateral</div>\n      <div class=\"ol-branch\">\n        <div class=\"ol-leg p\"><div class=\"ol-leg-k\">P</div><div class=\"ol-leg-t\">Sold for USDC</div><div class=\"ol-leg-s\">Lender's claim</div></div>\n        <div class=\"ol-leg n\"><div class=\"ol-leg-k\">N</div><div class=\"ol-leg-t\">Kept to reclaim</div><div class=\"ol-leg-s\">Your right</div></div>\n      </div>\n    </div>\n    <div class=\"ol-steps\">\n      <div class=\"ol-step\"><span class=\"ol-n\">1</span><div><b>Lock your collateral</b><p>Deposit your token to open the position.</p></div></div>\n      <div class=\"ol-step\"><span class=\"ol-n\">2</span><div><b>It splits into P and N</b><p>Two linked tokens are minted against your collateral.</p></div></div>\n      <div class=\"ol-step\"><span class=\"ol-n\">3</span><div><b>Sell P for USDC</b><p>Selling the P claim is how the raise reaches your wallet.</p></div></div>\n      <div class=\"ol-step\"><span class=\"ol-n\">4</span><div><b>Keep N to reclaim</b><p>N is your right to repay and unlock the collateral.</p></div></div>\n    </div>\n    <div class=\"ol-out good\"><b>Repay by the deadline</b><p>You get your collateral back in full.</p></div>\n    <div class=\"ol-out bad\"><b>Miss the deadline</b><p>Lenders redeem the collateral instead. No liquidation in between.</p></div>\n  </div>\n  <div class=\"ol-view\" data-view=\"lender\" hidden>\n    <div class=\"ol-cards\">\n      <div class=\"ol-card\"><span class=\"ol-sq\">1</span><b>Fund with USDC</b><p>Provide USDC to fund a position and receive P.</p></div>\n      <div class=\"ol-card\"><span class=\"ol-sq\">2</span><b>Hold P</b><p>P is your claim to the agreed fixed repayment.</p></div>\n    </div>\n    <div class=\"ol-out good\"><b>If the borrower repays</b><p>Redeem P for the agreed USDC &mdash; your fixed yield.</p></div>\n    <div class=\"ol-out bad\"><b>If they do not</b><p>Redeem P for the locked collateral instead.</p></div>\n  </div>\n</div>\n<h2 id=\"what-oplend-is\">What OpLend is</h2>\n<p>Each loan is an isolated position. When a position is created, the vault mints two ERC-20 leg tokens:</p>\n<table><thead><tr><th>Leg token</th><th>Held by</th><th>Represents</th></tr></thead><tbody>\n<tr><td><code>P</code></td><td>Lenders</td><td>Principal claim purchased on the primary marketplace</td></tr>\n<tr><td><code>N</code></td><td>Borrower</td><td>Borrower-side / collateral claim for the position</td></tr>\n</tbody></table>\n<p>Leg tokens are controlled only by their position vault. N transfers can be disabled during funding so the borrower can always cancel and refund unsold P.</p>\n<h2 id=\"position-lifecycle\">Position lifecycle</h2>\n<ol>\n<li><strong>Create.</strong> The borrower approves collateral to the factory and calls <code>createPosition</code>, paying the creation fee. Collateral is locked and P / N leg tokens are minted.</li>\n<li><strong>Fund.</strong> The position is listed as a primary sale. Lenders call <code>buy</code> on the marketplace to purchase P with USDC until the target raise is met or the funding deadline passes.</li>\n<li><strong>Repay.</strong> The borrower repays the fixed total repayment amount by the repayment deadline via <code>repayInFull</code>.</li>\n<li><strong>Settle.</strong> After repayment or once the position can settle, claim tokens redeem through <code>settle</code>, <code>redeemP</code>, <code>settleAndRedeemP</code>, or <code>redeemPair</code>.</li>\n<li><strong>Refund.</strong> If funding does not fully sell, the borrower closes funding and reclaims collateral for unsold P via <code>claimCollateralRefund</code>.</li>\n</ol>\n<h2 id=\"position-parameters\">Position parameters</h2>\n<p>Every position is configured at creation with:</p>\n<table><thead><tr><th>Parameter</th><th>Meaning</th></tr></thead><tbody>\n<tr><td><code>collateral</code></td><td>Allowlisted ERC-20 locked by the borrower</td></tr>\n<tr><td><code>collateralAmount</code></td><td>Amount of collateral locked</td></tr>\n<tr><td><code>targetRaiseUsdc</code></td><td>USDC the borrower aims to raise from P sales</td></tr>\n<tr><td><code>totalRepaymentUsdc</code></td><td>Fixed total the borrower must repay (must exceed the target raise)</td></tr>\n<tr><td><code>fundingDeadline</code></td><td>When the primary sale closes</td></tr>\n<tr><td><code>repaymentDeadline</code></td><td>When repayment is due</td></tr>\n</tbody></table>\n<h2 id=\"protocol-constants\">Protocol constants</h2>\n<table><thead><tr><th>Constant</th><th>Value</th></tr></thead><tbody>\n<tr><td><code>CREATION_FEE</code></td><td>0.0001 ETH per position</td></tr>\n<tr><td><code>SALE_FEE_BPS</code></td><td>10 bps (0.1%) on primary P sales</td></tr>\n<tr><td><code>BPS_DENOMINATOR</code></td><td>10,000</td></tr>\n<tr><td><code>MIN_FUNDING_PERIOD</code></td><td>1 hour</td></tr>\n<tr><td><code>MAX_FUNDING_PERIOD</code></td><td>30 days</td></tr>\n<tr><td><code>MAX_REPAYMENT_PERIOD</code></td><td>365 days</td></tr>\n</tbody></table>\n<h2 id=\"oplend-contracts\">Contracts</h2>\n<p>Always verify contract addresses from official PMFI sources.</p>\n<table><thead><tr><th>Contract</th><th>Address</th><th>Notes</th></tr></thead><tbody>\n<tr><td>Position factory</td><td><span class=\"inline-flex items-center gap-2\"><code>0xb2458426F7263B3Aec44ba6E3466bB4B5A175ccf</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td><td>Creates positions and leg tokens</td></tr>\n<tr><td>Primary marketplace</td><td><span class=\"inline-flex items-center gap-2\"><code>0xcC3E1C18b58eE8Ec6550C60b75d820E4b45e2D2F</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span>
