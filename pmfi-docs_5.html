</td><td>Primary P sales</td></tr>\n<tr><td>USDC</td><td><span class=\"inline-flex items-center gap-2\"><code>0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td><td>Base USDC</td></tr>\n<tr><td>Owner / fee-recipient Safe</td><td><span class=\"inline-flex items-center gap-2\"><code>0x7C8d9ad4F51299b02755Ec13C018004008b45494</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td><td>Administrative Safe</td></tr>\n</tbody></table>\n<h2 id=\"key-functions\">Key functions</h2>\n<table><thead><tr><th>Area</th><th>Functions</th></tr></thead><tbody>\n<tr><td>Create</td><td><code>createPosition</code>, <code>setCollateralAllowed</code>, <code>setCreationPaused</code></td></tr>\n<tr><td>Fund</td><td><code>buy</code>, <code>quoteUsdc</code>, <code>quoteFee</code>, <code>cancel</code>, <code>closeExpired</code></td></tr>\n<tr><td>Repay</td><td><code>repayInFull</code>, <code>repaymentRequiredUsdc</code>, <code>repaymentRemainingUsdc</code></td></tr>\n<tr><td>Settle</td><td><code>settle</code>, <code>settleAndRedeemP</code>, <code>redeemP</code>, <code>redeemPair</code>, <code>previewRedeemP</code></td></tr>\n<tr><td>Refund</td><td><code>closeFunding</code>, <code>claimCollateralRefund</code></td></tr>\n<tr><td>Fees</td><td><code>withdrawCreationFees</code>, <code>withdrawProtocolFees</code></td></tr>\n</tbody></table>\n<div class=\"docs-callout\"><strong>Note:</strong> Collateral must be on the strict allowlist. Fee-on-transfer collateral tokens are rejected. See the <a href=\"#audit\">Audit</a> page for the reviewed behavior and open review items.</div>\n<h2 id=\"faq\">FAQ</h2>\n<h3>Is this a normal loan?</h3>\n<p>Not exactly. There is no health factor, price-based liquidation, or extra debt. The borrower either repays the fixed USDC amount and gets the collateral back, or does not repay and gives up the collateral.</p>\n<h3>Why are there no liquidations?</h3>\n<p>OpLend does not use the collateral's market price to trigger liquidation. The collateral stays locked until the repayment deadline. Settlement depends only on whether the required USDC repayment was completed.</p>\n<h3>What happens if the borrower repays?</h3>\n<p>The borrower pays the fixed total repayment amount before the deadline. Lenders receive USDC, and the borrower can recover the locked collateral.</p>\n<h3>What happens if the borrower does not repay?</h3>\n<p>Lenders receive their proportional claim on the locked collateral. The borrower keeps the USDC already raised but loses the collateral. No additional debt is created.</p>\n<h3>What happens when a position is partially funded?</h3>\n<p>Only the funded part becomes active. For example, if a borrower wants to raise 1,000 USDC but lenders provide only 300 USDC, repayment is based on the funded 300 USDC portion &mdash; not the full 1,000 USDC target.</p>\n<h3>Can lenders exit early?</h3>\n<p>OpLend v1 does not guarantee an early exit. Lenders should expect to hold their position until the borrower repays or the position settles with collateral.</p>\n<h3>What are the risks?</h3>\n<p>Main risks include:</p>\n<ul><li>the collateral losing value;</li><li>the borrower not repaying;</li><li>limited liquidity for the collateral;</li><li>funds remaining locked until settlement;</li><li>inaccurate market-price estimates.</li></ul>\n<h3>Where does the lender's APR come from?</h3>\n<p>The lender provides USDC now and may receive a larger fixed amount later. For example, a lender provides 100 USDC and the repayment is 110 USDC. The 10 USDC difference is the potential return. The interface converts that return and the repayment period into an implied APR.</p>\n<p>The APR is not guaranteed because the borrower may not repay. In that case, the lender receives collateral instead of USDC.</p>\n<h3>Does the borrower repay the future market value of the collateral?</h3>\n<p>No. The borrower repays the fixed total repayment amount agreed when the position was created. If the collateral later becomes worth more or less, the repayment amount does not change.</p>\n<h3>Does the collateral price affect settlement?</h3>\n<p>No. The market price does not change the repayment amount, trigger liquidation, or decide the settlement result. It only affects whether repaying is economically attractive to the borrower and how valuable the collateral may be to the lender.</p>\n<h3>Who bears the collateral-price risk?</h3>\n<p>The lender bears the main downside price risk. If the borrower does not repay and the collateral has fallen in value, the lender may receive collateral worth less than the USDC provided. The borrower risks losing the collateral and any future increase in its value.</p>\n<h3>Can a borrower raise the full estimated value of the collateral?</h3>\n<p>The borrower can enter their preferred terms, but lenders decide whether to fund them. OpLend shows a suggested raise based on the estimated collateral value and repayment period. Longer repayment periods use a lower suggested percentage to give lenders more protection. The suggestion is not a guarantee that the position will be funded.</p>\n<h3>Does the borrower get the borrowed USDC back at settlement?</h3>\n<p>No. The borrower receives the USDC when lenders fund the position. At settlement, the borrower either:</p>\n<ul><li>repays the fixed amount and gets the collateral back; or</li><li>keeps the USDC already raised and gives up the collateral.</li></ul>\n<h3>What happens if the collateral price falls by 50%?</h3>\n<p>The fixed repayment amount does not change. The borrower may decide that repaying is no longer worthwhile. If the borrower does not repay, the lender receives the collateral and bears the loss in its value. There is no automatic liquidation before the deadline.</p>\n<h3>What happens if the collateral price increases significantly?</h3>\n<p>The repayment amount still does not change. The borrower may be more motivated to repay because the collateral is now worth more. If the borrower does not repay, the lender receives the more valuable collateral.</p>\n<h3>Is non-repayment an additional debt owed by the borrower?</h3>\n<p>No. Non-repayment does not create extra wallet debt or give the protocol access to unrelated assets. Settlement is limited to the collateral locked in that position. The borrower can lose the locked collateral, but does not owe an additional amount after settlement.</p>\n</article>", "audit": "<article class=\"docs-article\">\n<span class=\"docs-eyebrow\">Security Review</span>\n<h1>Audit</h1>\n<p>This page summarizes the OpLend V2.2 security review. The review was AI-assisted and used the ETHSKILLS Audit methodology, supported by exact-source analysis, Foundry regression tests, fuzz testing, stateful invariants, adversarial-token tests, reentrancy tests, Slither static analysis, and deployed-runtime correspondence checks.</p>\n<div class=\"docs-callout audit\"><strong>This is not an independent audit-firm attestation.</strong> It does not guarantee that the contracts are defect-free. The pArbitrage Vault audit remains pending; see <a href=\"#what-is-pmfi\">What is PMFI?</a></div>\n<h2 id=\"full-audit-reports\">Full audit reports</h2>\n<p>The complete OpLend V2.2 audit materials are published in full:</p>\n<table><thead><tr><th>Report</th><th>Link</th></tr></thead><tbody>\n<tr><td>PMFI OpLend V2.2 audit repository</td><td><a href=\"https://github.com/zaratustrastar/oplend-v22-security-audit\" target=\"_blank\" rel=\"noopener noreferrer\">github.com/zaratustrastar/oplend-v22-security-audit &#8599;</a></td></tr>\n<tr><td>Leftclaw audit (IPFS)</td><td><a href=\"https://bafkreigtgmshd35dimdnlst4w3umzdusi554i2likcviqdxjh4xt2drkne.ipfs.community.bgipfs.com/\" target=\"_blank\" rel=\"noopener noreferrer\">View on IPFS &#8599;</a></td></tr>\n</tbody></table>\n<h2 id=\"reviewed-contracts\">Reviewed contracts</h2>\n<ul>\n<li><code>PMFILegTokenV22</code></li>\n<li><code>PMFIPositionVaultV22</code></li>\n<li><code>PMFIPositionFactoryV22</code></li>\n<li><code>PMFIPrimaryMarketplaceV22</code></li>\n</ul>\n<h2 id=\"reviewed-deployment\">Reviewed deployment</h2>\n<table><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody>\n<tr><td>Network</td><td>Base Mainnet, chain ID 8453</td></tr>\n<tr><td>Factory</td><td><span class=\"inline-flex items-center gap-2\"><code>0xb2458426F7263B3Aec44ba6E3466bB4B5A175ccf</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td></tr>\n<tr><td>Primary marketplace</td><td><span class=\"inline-flex items-center gap-2\"><code>0xcC3E1C18b58eE8Ec6550C60b75d820E4b45e2D2F</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td></tr>\n<tr><td>Base USDC</td><td><span class=\"inline-flex items-center gap-2\"><code>0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td></tr>\n<tr><td>Administrative Safe</td><td><span class=\"inline-flex items-center gap-2\"><code>0x7C8d9ad4F51299b02755Ec13C018004008b45494</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button></span></td></tr>\n<tr><td>Reviewed source commit</td><td><code>37c5ce52e2714222c25f94d75c31522755cc6827</code></td></tr>\n<tr><td>PMFIOpLendingV22.sol SHA-256</td><td><code>c79797d82e6a294a690393b5512012989bd053e6d1b7c16b8ca5c1e5b233f79c</code></td></tr>\n</tbody></table>\n<h2 id=\"compiler-profile\">Compiler profile</h2>\n<pre class=\"docs-code-block\"><code>Solidity 0.8.24\nOptimizer enabled\nOptimizer runs: 200\nVia IR enabled</code></pre>\n<h2 id=\"validation-result\">Validation result</h2>\n<table><thead><tr><th>Check</th><th>Result</th></tr></thead><tbody>\n<tr><td>V2.2 test suites</td><td>14</td></tr>\n<tr><td>Tests passed</td><td>71</td></tr>\n<tr><td>Tests failed</td><td>0</td></tr>\n<tr><td>Tests skipped</td><td>0</td></tr>\n<tr><td>Predictable-address prefunding regression</td><td>3 / 3 passed</td></tr>\n<tr><td>Local factory runtime</td><td>21,839 bytes</td></tr>\n<tr><td>Clean-build local runtime hash</td><td><code>078c25e80bdad655150a85ac64d807e26625941d1001586c02647358753c69f8</code></td></tr>\n<tr><td>Deployed runtime</td><td>Exact match after immutable normalization</td></tr>\n</tbody></table>\n<div class=\"docs-callout\"><strong>Static analysis:</strong> The historical filtered Slither run reported 0 results, while a fresh unrestricted Slither 0.11.5 run reported 57 detector results. Both logs are preserved and explained in the review's static-analysis report.</div>\n<h2 id=\"findings-status\">Findings status</h2>\n<table><thead><tr><th>Topic</th><th>Status</th><th>Evidence or next step</th></tr></thead><tbody>\n<tr><td>Predictable future-vault prefunding</td><td>Mitigated in deployed V2.2</td><td>Exact runtime match and dedicated regression tests</td></tr>\n<tr><td>Collateral donations</td><td>Tested: no additional claims</td><td>Prefunding, binary-settlement and invariant tests</td></tr>\n<tr><td>USDC donations</td><td>Tested: no additional claims</td><td>Binary-settlement and invariant tests</td></tr>\n<tr><td>Full repayment</td><td>Enforced</td><td>Full-repayment regression suite</td></tr>\n<tr><td>Partial-fill pricing</td><td>Cumulative pricing implemented</td><td>Cumulative-pricing regression suite</td></tr>\n<tr><td>Strict collateral allowlist</td><td>Enforced</td><td>Strict-allowlist regression suite</td></tr>\n<tr><td>Exact collateral transfers</td><td>Enforced</td><td>Adversarial and manual-review regression suites</td></tr>\n<tr><td>Exact marketplace USDC payouts</td><td>Enforced</td><td>Manual-review regression suites</td></tr>\n<tr><td>Reentrancy callbacks</td><td>Rejected atomically</td><td>Dedicated reentrancy regression suite</td></tr>\n<tr><td>Borrower USDC blacklist</td><td>Operational dependency</td><td>Review permissionless third-party repayment</td></tr>\n<tr><td>Seller USDC blacklist</td><td>Funding availability dependency</td><td>Review escrow and payout design</td></tr>\n<tr><td>Zero-output P redemption</td><td>Open boundary review</td><td>Add reachable-state rounding proof</td></tr>\n<tr><td>Minimum P purchase</td><td>Open boundary review</td><td>Quantify realistic minimum order sizes</td></tr>\n<tr><td>P donation to marketplace</td><td>Priority open review item</td><td>Test repayment and default settlement</td></tr>\n<tr><td>Zero-P and zero-N terminal state</td><td>Open review item</td><td>Verify no accounted assets remain inaccessible</td></tr>\n</tbody></table>\n<h2 id=\"scope\">Scope</h2>\n<h3>In scope</h3>\n<p>Position creation, collateral accounting, P/N token supply, primary funding, partial fills, cumulative pricing, repayment, settlement, refunds, allowlisting, pauses, deadlines, token-transfer behavior, reentrancy, fuzzing, stateful invariants, static analysis, and deployed-runtime correspondence.</p>\n<h3>Out of scope</h3>\n<p>Frontend code, wallet authentication, website infrastructure, Safe signer security, Circle's internal controls, token-price estimates, future protocol versions, future collateral integrations, and offchain operational processes.</p>\n</article>", "tokenomics": "<article class=\"docs-article\">\n<span class=\"docs-eyebrow\">$PMFI token</span>\n<h1>$PMFI Tokenomics</h1>\n<p>$PMFI is the utility and alignment token of the PMFI ecosystem.</p>\n<p>It is designed to connect PMFI's products, protocol revenue, and token utility through two primary mechanisms:</p>\n<ol>\n<li><strong>Protocol revenue is allocated to $PMFI buybacks and burns.</strong></li>\n<li><strong>$PMFI holders receive access to advanced PMFI products and strategies.</strong></li>\n</ol>\n<p>Many tokens become disconnected from the products they are intended to represent. PMFI is being built differently: as PMFI's product ecosystem expands, the role and utility of $PMFI are intended to expand alongside it.</p>\n<h2 id=\"token-overview\">Token overview</h2>\n<table><thead><tr><th>Property</th><th>Details</th></tr></thead><tbody>\n<tr><td>Token name</td><td>PMFI</td></tr>\n<tr><td>Symbol</td><td>$PMFI</td></tr>\n<tr><td>Network</td><td>Base</td></tr>\n<tr><td>Token standard</td><td>ERC-20</td></tr>\n<tr><td>Contract address</td><td><span class=\"inline-flex items-center gap-2\"><code>0xD77CE6D3137342Bb5174673bDab5f51Db16fcBA3</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button><a href=\"https://basescan.org/token/0xd77ce6d3137342bb5174673bdab5f51db16fcba3\" target=\"_blank\" rel=\"noopener noreferrer\">BaseScan &#8599;</a></span></td></tr>\n<tr><td>Decimals</td><td>18</td></tr>\n<tr><td>Maximum total supply displayed on BaseScan</td><td>100,000,000,000 PMFI</td></tr>\n<tr><td>Launch model</td><td>Fair launch through Bankr</td></tr>\n</tbody></table>\n<div class=\"docs-callout verify\"><strong>Always verify the contract address</strong> before interacting with or acquiring $PMFI.</div>\n<h2 id=\"launch-and-distribution\">Launch and distribution</h2>\n<p>$PMFI was launched through Bankr's fair-launch mechanism on Base.</p>\n<p>The initial token supply was introduced through market liquidity rather than divided through a conventional private-sale allocation. As a result, PMFI does not use a traditional token allocation chart separating private investors, public-sale participants, the team, and the community.</p>\n<p>Team-associated wallets and the PMFI multisig are publicly disclosed below so that their balances and transactions can be independently monitored onchain.</p>\n<p><a href=\"https://basescan.org/tx/0x045735c177f1c8521c4fb68189c6a53e66a67ece28c0b3f30f786f0784e038d4\" target=\"_blank\" rel=\"noopener noreferrer\">View the $PMFI launch transaction on BaseScan &#8599;</a></p>\n<h2 id=\"token-utility\">Token utility</h2>\n<p>$PMFI is designed around two core forms of utility: protocol revenue alignment and access to advanced PMFI products.</p>\n<h3>Protocol revenue alignment</h3>\n<p>PMFI allocates 90% of designated realized protocol revenue to $PMFI market buybacks and permanent token burns.</p>\n<p>This establishes a direct relationship between protocol activity and the token:</p>\n<div class=\"docs-callout\"><strong>Product usage &rarr; protocol revenue &rarr; $PMFI buybacks &rarr; permanent burns</strong></div>\n<p>The allocation applies to revenue earned by the protocol. User deposits, supplied liquidity, vault principal, collateral, and funds belonging to protocol users are not treated as protocol revenue and are not used for buybacks.</p>\n<h3>Access to advanced products</h3>\n<p>Selected advanced PMFI vaults, strategies, and protocol features will use $PMFI-based access requirements.</p>\n<p>Depending on the product, access may be based on holding, staking, or another defined eligibility mechanism. The exact requirements will be documented before each gated product is introduced.</p>\n<p>The existing <a href=\"#parbitrage-vault\">pARBITRAGE vault</a> remains accessible without staking $PMFI unless otherwise specified in its product documentation.</p>\n<h2 id=\"the-value-wheel\">The Value Wheel</h2>\n<p>The Value Wheel is PMFI's framework for connecting products, revenue generation, token utility, and long-term ecosystem alignment.</p>\n<table><thead><tr><th>PMFI revenue source</th><th>$PMFI allocation</th></tr></thead><tbody>\n<tr><td><a href=\"#parbitrage-vault\">pARBITRAGE vault</a> protocol revenue</td><td>90% to buybacks and burns</td></tr>\n<tr><td><a href=\"#oplend\">OpLend</a> protocol revenue</td><td>90% to buybacks and burns</td></tr>\n<tr><td><a href=\"#virtuals-acp-integration\">Virtuals ACP</a> job revenue</td><td>90% to buybacks and burns</td></tr>\n<tr><td><a href=\"#spread-intelligence-api\">Spread Intelligence</a> endpoint revenue</td><td>90% to buybacks and burns</td></tr>\n<tr><td>Future designated PMFI revenue streams</td><td>Intended to join the same Value Wheel</td></tr>\n</tbody></table>\n<h3>How the Value Wheel works</h3>\n<ol>\n<li>A PMFI product generates revenue.</li>\n<li>PMFI receives its realized protocol share.</li>\n<li>90% of the designated revenue is allocated to purchasing $PMFI from the market.</li>\n<li>The acquired tokens are permanently burned.</li>\n<li>Completed buyback and burn transactions remain publicly verifiable onchain.</li>\n<li>New products introduce additional revenue sources and expand $PMFI utility.</li>\n</ol>\n<p>The intended cycle is:</p>\n<div class=\"docs-callout\"><strong>More products &rarr; more protocol usage &rarr; more realized revenue &rarr; more $PMFI buybacks and burns</strong></div>\n<h2 id=\"revenue-sources\">Revenue sources</h2>\n<h3>pARBITRAGE</h3>\n<p>pARBITRAGE generates returns through automated arbitrage strategies across prediction markets.</p>\n<p>The Value Wheel applies only to the protocol's realized share of vault revenue. Depositor principal and returns belonging to vault participants are not used for $PMFI buybacks.</p>\n<h3>OpLend</h3>\n<p><a href=\"#oplend\">OpLend</a> is PMFI's fixed-term, token-collateral lending protocol.</p>\n<p>Designated protocol fees generated through OpLend are included in the Value Wheel, with 90% allocated to $PMFI buybacks and burns.</p>\n<h3>Spread Intelligence</h3>\n<p>PMFI provides executable prediction-market arbitrage data to agents, applications, and market participants through its <a href=\"#spread-intelligence-api\">Spread Intelligence</a> infrastructure.</p>\n<p>Designated revenue generated through the Spread Intelligence endpoint, including Bankr x402 requests, is allocated to the Value Wheel.</p>\n<h3>Virtuals ACP</h3>\n<p>Revenue earned from completed PMFI jobs through <a href=\"#virtuals-acp-integration\">Virtuals ACP</a> is also included in the Value Wheel, with 90% allocated to $PMFI buybacks and burns.</p>\n<h2 id=\"buybacks-and-burns\">Buybacks and burns</h2>\n<p>Buybacks are funded using designated realized protocol revenue.</p>\n<p>They may be executed periodically rather than immediately after each individual revenue event. Once completed:</p>\n<ul>\n<li>$PMFI is purchased from the open market;</li>\n<li>the acquired tokens are sent to a burn address or otherwise permanently removed from circulation;</li>\n<li>the relevant transactions can be independently verified onchain.</li>\n</ul>\n<p>Buybacks and burns are a protocol alignment mechanism. They do not represent direct revenue distributions to token holders or guarantee any specific market outcome.</p>\n<h2 id=\"public-wallets\">Public wallets</h2>\n<p>The following addresses are publicly disclosed to support onchain transparency.</p>\n<table><thead><tr><th>Wallet</th><th>Address</th></tr></thead><tbody>\n<tr><td>Team-associated wallet 1</td><td><span class=\"inline-flex items-center gap-2\"><code>0x7e5f1530554d021a66b412972720e050a7a433c9</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button><a href=\"https://basescan.org/address/0x7e5f1530554d021a66b412972720e050a7a433c9\" target=\"_blank\" rel=\"noopener noreferrer\">BaseScan &#8599;</a></span></td></tr>\n<tr><td>Team-associated wallet 2</td><td><span class=\"inline-flex items-center gap-2\"><code>0x93cddc53615df3af9066ed5a1fd32e68cbcf3786</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button><a href=\"https://basescan.org/address/0x93cddc53615df3af9066ed5a1fd32e68cbcf3786\" target=\"_blank\" rel=\"noopener noreferrer\">BaseScan &#8599;</a></span></td></tr>\n<tr><td>PMFI multisig</td><td><span class=\"inline-flex items-center gap-2\"><code>0x7C8d9ad4F51299b02755Ec13C018004008b45494</code><button type=\"button\" class=\"docs-copy-btn\">Copy</button><a href=\"https://basescan.org/address/0x7C8d9ad4F51299b02755Ec13C018004008b45494\" target=\"_blank\" rel=\"noopener noreferrer\">BaseScan &#8599;</a></span></td></tr>\n</tbody></table>\n<p>Wallet balances and transactions can be independently verified on BaseScan.</p>\n<h2 id=\"future-expansion\">Future expansion</h2>\n<p>Future PMFI products, revenue streams, and token-gated features are intended to become part of the same Value Wheel.</p>\n<p>This may include:</p>\n<ul>\n<li>additional automated arbitrage vaults;</li>\n<li>new prediction-market strategies;</li>\n<li>agent-facing data products;</li>\n<li>execution and intelligence infrastructure;</li>\n<li>advanced products available to eligible $PMFI holders.</li>\n</ul>\n<p>The applicable revenue allocation and access conditions for each new product will be documented when it is introduced.</p>\n<h2 id=\"summary\">Summary</h2>\n<p>$PMFI serves as the alignment layer across the PMFI ecosystem.</p>\n<p>Its token model connects:</p>\n<ul>\n<li>PMFI product usage;</li>\n<li>realized protocol revenue;</li>\n<li>market buybacks;</li>\n<li>permanent token burns;</li>\n<li>access to advanced products and strategies;</li>\n<li>transparent onchain execution.</li>\n</ul>\n<p>Rather than operating independently from the protocol, $PMFI is designed to remain directly connected to PMFI's products, revenue, and continued ecosystem expansion.</p>\n<div class=\"docs-callout\"><strong>Disclaimer:</strong> Nothing on this page constitutes financial, legal, or investment advice.</div>\n</article>", "faq": "<article class=\"docs-article\">\n<span class=\"docs-eyebrow\">Resources</span>\n<h1>FAQ</h1>\n<p>Answers below are drawn from the rest of this documentation. Where a topic has a dedicated page, a link is provided.</p>\n<h2 id=\"what-is-pmfi-faq\">What is PMFI?</h2>\n<p>PMFI is a protocol for automated prediction market vaults on Base. Its first product is the pArbitrage Vault, a USDC-denominated vault that executes prediction market arbitrage when pricing and execution conditions are met. See <a href=\"#what-is-pmfi\">What is PMFI?</a></p>\n<h2 id=\"which-network\">Which network does PMFI run on?</h2>\n<p>Base. The deposit asset is USDC and the vault token is pARB.</p>\n<h2 id=\"is-it-audited\">Is PMFI audited?</h2>\n<p>OpLend V2.2 has a published security review; see the <a href=\"#audit\">Audit</a> page. The pArbitrage Vault audit is still pending.</p>\n<h2 id=\"are-returns-guaranteed\">Are returns guaranteed?</h2>\n<p>No. The vault does not guarantee profit, APR, or APY. APR and APY shown in the app are estimates. See <a href=\"#risk-disclosure\">Risk disclosure</a>.</p>\n<h2 id=\"why-no-shares-immediately\">Why didn't I receive shares or USDC immediately?</h2>\n<p>PMFI uses asynchronous, report-based accounting. Deposit and redemption requests are processed by a vault report, not instantly. See <a href=\"#user-flow\">User flow</a>.</p>\n<h2 id=\"how-are-deposits-priced\">How are deposits priced?</h2>\n<p>Deposits are processed at the higher of the current PPS or the initial $1.00 PPS: <code>depositPPS = max(currentPPS, INITIAL_PPS)</code>. This prevents below-$1 entry and protects existing holders from dilution.</p>\n<h2 id=\"how-do-redemptions-work\">How do redemptions work?</h2>\n<p>Redemption requests are priced at the official PPS and processed in FIFO order when the vault has enough spendable USDC. Redemptions are paid from a liquidity waterfall before open positions are touched. See <a href=\"#liquidity-management\">Liquidity management</a>.</p>\n<h2 id=\"what-are-the-fees\">What are the fees?</h2>\n<p>The pArbitrage Vault charges a 20% performance fee on profit above the high-water mark. OpLend charges a 0.0001 ETH creation fee and a 10 bps primary sale fee. Spread Intelligence costs $0.05 USDC per request.</p>\n<h2 id=\"which-venues\">Which venues does the strategy use?</h2>\n<p>Polymarket, Kalshi, and Opinion are currently supported. PMFI may add venues over time. See <a href=\"#strategy-logic\">Strategy logic</a>.</p>\n<h2 id=\"what-is-oplend-faq\">What is OpLend?</h2>\n<p>OpLend is PMFI's onchain fixed-term credit marketplace: borrowers lock collateral and raise USDC by selling principal claim tokens to lenders, then repay a fixed total by a deadline. See <a href=\"#oplend\">OpLend</a>.</p>\n<h2 id=\"what-is-spread-intelligence-faq\">What is Spread Intelligence?</h2>\n<p>A paid x402 endpoint that returns actionable cross-market prediction-market spread signals for agents and applications. It is informational only and does not execute trades. See <a href=\"#spread-intelligence-api\">Spread Intelligence API</a>.</p>\n<h2 id=\"how-do-i-verify-contracts\">How do I verify contract addresses?</h2>\n<p>Verify the domain is <code>pmfi.cc</code> or <code>docs.pmfi.cc</code>, check the address against BaseScan, and never use addresses from unofficial links. See <a href=\"#contract-addresses\">Contract addresses</a>.</p>\n<h2 id=\"can-i-cancel-a-stuck-request\">Can I cancel a stuck request?</h2>\n<p>If a deposit or redeem request stays pending longer than <code>MAX_REQUEST_AGE = 30 days</code>, the request owner can cancel it. Stale deposits return USDC; stale redemptions return locked pARB shares.</p>\n</article>"}, "titles": {"what-is-pmfi": "What is PMFI?", "parbitrage-vault": "pArbitrage Vault", "strategy-logic": "Strategy logic", "accounting-metrics": "Accounting & metrics", "user-flow": "User flow", "liquidity-management": "Liquidity management", "spread-intelligence-api": "Spread Intelligence API", "virtuals-acp-integration": "Virtuals ACP Integration", "risk-disclosure": "Risk disclosure", "risk-mitigation": "Risk mitigation", "contract-addresses": "Contract addresses", "oplend": "OpLend", "audit": "Audit", "tokenomics": "Tokenomics", "faq": "FAQ"}, "sections": [{"title": "Overview", "items": ["what-is-pmfi", "parbitrage-vault", "strategy-logic", "accounting-metrics", "user-flow", "liquidity-management"]}, {"title": "Developers", "items": ["spread-intelligence-api", "virtuals-acp-integration"]}, {"title": "Security & Risk", "items": ["risk-disclosure", "risk-mitigation", "contract-addresses"]}, {"title": "OpLend", "items": ["oplend"]}, {"title": "Audit", "items": ["audit"]}, {"title": "Token", "items": ["tokenomics"]}, {"title": "Resources", "items": ["faq"]}], "order": ["what-is-pmfi", "parbitrage-vault", "strategy-logic", "accounting-metrics", "user-flow", "liquidity-management", "spread-i const { pages, titles, sections, order } = DATA;
const PRESERVED = new Set(order.slice(0, order.length - 4));
const NEW_SECTIONS = new Set(["OpLend","Audit","Token","Resources"]);
const groupOf = {};
sections.forEach(s => s.items.forEach(id => groupOf[id] = s.title));

const $ = sel => document.querySelector(sel);
const app = $(".pmfi-docs");
const sidebar = $("#sidebar");
const main = $("#main");
const tocInner = $("#toc-inner");

/* build sidebar */
(function buildNav(){
  let n = 0;
  const frag = document.createDocumentFragment();
  for (const sec of sections){
    const g = document.createElement("div"); g.className = "nav-group";
    const t = document.createElement("div");
    t.className = "nav-group-title";
    t.textContent = sec.title;
    g.appendChild(t);
    for (const id of sec.items){
      n++;
      const a = document.createElement("a");
      a.className = "nav-item"; a.href = "#" + id; a.dataset.page = id;
      a.dataset.title = (titles[id] || id).toLowerCase();
      a.innerHTML = '<span class="idx">' + String(n).padStart(2,"0") + '</span><span class="lbl">' + (titles[id]||id) + '</span>';
      g.appendChild(a);
    }
    frag.appendChild(g);
  }
  $("#nav-scroll").appendChild(frag);
})();

const navItems = [...document.querySelectorAll(".nav-item")];

/* render a page */
let spy = null;
function renderPage(id){
  if (!pages[id]) id = order[0];
  main.querySelector(".docs-breadcrumb .cur").textContent = titles[id] || id;
  main.querySelector(".docs-breadcrumb .grp").textContent = groupOf[id] || "";
  const art = main.querySelector("#article");
  art.innerHTML = pages[id];
  navItems.forEach(a => a.classList.toggle("active", a.dataset.page === id));
  buildToc(art);
  document.title = (titles[id] || "PMFI") + " · PMFI Docs";
  window.scrollTo({ top: 0, behavior: "auto" });
  app.classList.remove("nav-open");
}

/* table of contents from h2 (+ h3) */
function buildToc(art){
  if (spy) { spy.disconnect(); spy = null; }
  const heads = [...art.querySelectorAll("h2[id], h3[id]")];
  if (!heads.length){ tocInner.innerHTML = ""; return; }
  let html = '<div class="toc-title">On this page</div>';
  for (const h of heads){
    const sub = h.tagName === "H3" ? " sub" : "";
    html += '<a class="' + sub.trim() + '" href="#" data-goto="' + h.id + '">' + h.textContent + '</a>';
  }
  tocInner.innerHTML = html;
  const links = [...tocInner.querySelectorAll("a")];
  const byId = {}; links.forEach(l => byId[l.dataset.goto] = l);
  spy = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting){
        links.forEach(l => l.classList.remove("active"));
        const l = byId[e.target.id]; if (l) l.classList.add("active");
      }
    });
  }, { rootMargin: "-72px 0px -70% 0px", threshold: 0 });
  heads.forEach(h => spy.observe(h));
}

/* routing: bare #id where id is a page -> navigate; else scroll within page */
function handleHash(){
  const raw = decodeURIComponent(location.hash.slice(1));
  if (pages[raw]) { renderPage(raw); return; }
  const el = document.getElementById(raw);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}
window.addEventListener("hashchange", handleHash);

/* intercept in-article hash links (cross-page + in-page anchors) */
main.addEventListener("click", (e) => {
  const a = e.target.closest("a"); if (!a) return;
  const href = a.getAttribute("href") || "";
  if (!href.startsWith("#")) return;                 // external links pass through
  e.preventDefault();
  const id = decodeURIComponent(href.slice(1));
  if (pages[id]) { location.hash = id; }             // jump to another doc
  else { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" }); }
});

/* toc scroll */
tocInner.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-goto]"); if (!a) return;
  e.preventDefault();
  const el = document.getElementById(a.dataset.goto);
  if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
});

/* copy buttons */
main.addEventListener("click", (e) => {
  const b = e.target.closest(".docs-copy-btn"); if (!b) return;
  const span = b.closest("span"); const code = span && span.querySelector("code");
  const text = code ? code.textContent : "";
  navigator.clipboard.writeText(text).then(() => {
    const prev = b.textContent; b.textContent = "Copied"; b.classList.add("done");
    setTimeout(() => { b.textContent = prev; b.classList.remove("done"); }, 1400);
  }).catch(() => {});
});

/* how-it-works borrower/lender toggle */
main.addEventListener("click", (e) => {
  const tab = e.target.closest(".ol-tab"); if (!tab) return;
  const box = tab.closest(".ol-hiw"); const view = tab.dataset.view;
  box.querySelectorAll(".ol-tab").forEach(t => t.classList.toggle("active", t === tab));
  box.querySelectorAll(".ol-view").forEach(v => { v.hidden = v.dataset.view !== view; });
});

/* sidebar search */
const search = $("#search");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  navItems.forEach(a => {
    const hit = !q || a.dataset.title.includes(q);
    a.style.display = hit ? "" : "none";
  });
  document.querySelectorAll(".nav-group").forEach(g => {
    const any = [...g.querySelectorAll(".nav-item")].some(a => a.style.display !== "none");
    g.style.display = any ? "" : "none";
  });
});

/* mobile drawer */
$("#menu-btn").addEventListener("click", () => app.classList.toggle("nav-open"));
$("#scrim").addEventListener("click", () => app.classList.remove("nav-open"));
sidebar.addEventListener("click", (e) => { if (e.target.closest(".nav-item")) app.classList.remove("nav-open"); });

/* ambient perspective grid (ported from landing WireGrid) */
(function grid(){
  const canvas = $("#grid"); const ctx = canvas.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let raf = 0, t = 0;
  const size = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
  const draw = () => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = "rgba(120,142,184,0.16)"; ctx.lineWidth = 0.5;
    const cx = canvas.width/2, cy = canvas.height*0.30, n = 22;
    for (let i=0;i<=n;i++){ const px=(i/n)*canvas.width; ctx.beginPath(); ctx.moveTo(px,0); ctx.bezierCurveTo(cx,cy,cx,cy,px,canvas.height); ctx.stroke(); }
    const rows = 14;
    for (let j=0;j<=rows;j++){
      const py = cy + (j/rows)*(canvas.height-cy)*1.1 + (reduce?0:Math.sin(t*0.0006+j)*1.2);
      ctx.beginPath(); ctx.moveTo(0,py); ctx.lineTo(canvas.width,py);
      ctx.globalAlpha = 0.5*(1-(j/rows)*0.5); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (!reduce){ t+=16; raf=requestAnimationFrame(draw); }
  };
  addEventListener("resize", () => { size(); if (reduce) draw(); });
  size(); draw();
})();

/* boot */
handleHash();
if (!pages[decodeURIComponent(location.hash.slice(1))]) renderPage(order[0]);
</script>
